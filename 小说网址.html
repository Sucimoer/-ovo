(function(){

        if(!allCards.length) return;
        if(p<1)p=1;if(p>totalPages)p=totalPages;
        currentPage=p;
        const start=(currentPage-1)*ITEMS_PER_PAGE,end=start+ITEMS_PER_PAGE;
        allCards.forEach((c,i)=>{c.style.display=(i>=start&&i<end)?'': 'none';});
        update();
    }
    function buildUI(){
        if(!pagi) return;
        totalPages=Math.ceil(allCards.length/ITEMS_PER_PAGE);
        pagi.innerHTML='';
        const prev=document.createElement('button'); prev.className=`pagination-btn px-3 py-1.5 rounded-lg text-sm font-medium border bg-white dark:bg-gray-800 ${currentPage===1?'disabled opacity-50 cursor-not-allowed':''}`; prev.innerHTML='<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg><span>Previous</span>'; if(currentPage!==1) prev.addEventListener('click',()=>go(currentPage-1)); pagi.appendChild(prev);
        let startPage=Math.max(1,currentPage-2),endPage=Math.min(totalPages,startPage+4); if(endPage-startPage<4) startPage=Math.max(1,endPage-4);
        if(startPage>1){addBtn(1); if(startPage>2) addEllip();}
        for(let i=startPage;i<=endPage;i++) addBtn(i);
        if(endPage<totalPages){if(endPage<totalPages-1) addEllip(); addBtn(totalPages);}
        function addBtn(p){const btn=document.createElement('button'); btn.textContent=p; btn.className=`page-number pagination-btn w-9 h-9 rounded-full text-sm ${p===currentPage?'active bg-gradient-to-r from-pink-500 to-rose-400 text-white':'bg-white dark:bg-gray-800 border border-gray-300'}`; if(p!==currentPage) btn.addEventListener('click',()=>go(p)); pagi.appendChild(btn);}
        function addEllip(){const span=document.createElement('span'); span.textContent='...'; span.className='px-2 text-gray-500'; pagi.appendChild(span);}
        const next=document.createElement('button'); next.className=`pagination-btn px-3 py-1.5 rounded-lg text-sm font-medium border bg-white dark:bg-gray-800 ${currentPage===totalPages?'disabled opacity-50 cursor-not-allowed':''}`; next.innerHTML='<span>Next</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>'; if(currentPage!==totalPages) next.addEventListener('click',()=>go(currentPage+1)); pagi.appendChild(next);
    }
    function update(){buildUI();}
    function go(p){if(p<1||p>totalPages||p===currentPage) return; currentPage=p; render(currentPage); window.dispatchEvent(new CustomEvent('paginationChanged',{detail:{page:currentPage}}));}
    function init(){allCards=collect(); totalPages=Math.ceil(allCards.length/ITEMS_PER_PAGE); currentPage=1; allCards.forEach(c=>c.style.display='none'); render(1); if(pagi) pagi.style.display='flex';}
    document.head.appendChild(Object.assign(document.createElement('style'),{textContent:`@keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}.card-item{animation:fadeInUp 0.2s ease-out;}`}));
    init();
    window.__paginationAPI={goToPage:go,getCurrentPage:()=>currentPage,getAllCards:()=>[...allCards],getItemsPerPage:()=>ITEMS_PER_PAGE,getTotalPages:()=>totalPages,getCardText:e=>{if(!e)return'';const c=e.cloneNode(true);c.querySelectorAll('script,style,.pagination-btn').forEach(el=>el.remove());return c.innerText||c.textContent||'';}};
})();

<script>
(function(){
    const toggle=document.getElementById('searchToggleBtn'),panel=document.getElementById('searchPanel'),header=document.getElementById('searchPanelHeader'),close=document.getElementById('searchPanelClose'),kw=document.getElementById('searchKeyword'),lk=document.getElementById('searchLink'),btnPage=document.getElementById('btnPageSearch'),btnJump=document.getElementById('btnJumpSearch'),btnBd=document.getElementById('btnBaiduSearch'),btnClr=document.getElementById('btnClear'),btnPrev=document.getElementById('btnPrevHighlight'),btnNext=document.getElementById('btnNextHighlight'),info=document.getElementById('searchResultInfo');

    function clearAll(){clearHL();matches=[];idx=-1;active='';kw.value='';lk.value='';info.innerText='';}
    btnPage.addEventListener('click',()=>doSearch(kw.value.trim())); btnNext.addEventListener('click',nextM); btnPrev.addEventListener('click',prevM); btnClr.addEventListener('click',clearAll);
    btnJump.addEventListener('click',()=>{const k=kw.value.trim(),l=lk.value.trim();if(!k){info.innerText='请输入关键词';return;}if(!l){info.innerText='请输入链接';return;}let url=l;if(!/^https?:\/\//i.test(url))url='https://'+url;window.open(url+'#:~:text='+encodeURIComponent(k),'_blank');info.innerText='已在新窗口尝试高亮';});
    btnBd.addEventListener('click',()=>{const k=kw.value.trim(),l=lk.value.trim();let domain=l?l.replace(/^https?:\/\//i,'').split('/')[0]:window.location.hostname;if(!k){info.innerText='请输入关键词';return;}if(!domain||domain==='localhost'){info.innerText='请输入有效域名';return;}window.open(`https://www.baidu.com/s?wd=site:${domain} ${encodeURIComponent(k)}`,'_blank');info.innerText='已打开百度站内搜索';});
    kw.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(kw.value.trim());});
    window.addEventListener('paginationChanged',async()=>{if(active&&matches.length&&idx>=0){await new Promise(r=>setTimeout(r,60));await jumpTo(matches[idx],active);}});
})();
</script>
