<div class="bg-layer inactive" id="bgLayerB" aria-hidden="true"></div>

<script>
(function() {
    const LOCAL_IMAGES = [
        "pictures/1.jpg", "pictures/2.jpg", "pictures/3.jpg", "pictures/4.jpg",
        "pictures/5.jpg", "pictures/6.jpg", "pictures/7.jpg", "pictures/8.jpg",
        "pictures/9.jpg", "pictures/10.jpg", "pictures/11.jpg", "pictures/12.jpg",
        "pictures/13.jpg", "pictures/14.jpg", "pictures/15.jpg", "pictures/16.jpg",
        "pictures/17.jpg"
    ];
    const bgLayerA = document.getElementById('bgLayerA');
    const bgLayerB = document.getElementById('bgLayerB');
    let activeLayer = 'A';
    let isChanging = false;

    function getRandomImage() {
        if (!LOCAL_IMAGES.length) return null;
        return LOCAL_IMAGES[Math.floor(Math.random() * LOCAL_IMAGES.length)];
    }
    function getInactiveLayer() {
        return activeLayer === 'A' ? bgLayerB : bgLayerA;
    }
    function switchActiveLayer() {
        const oldActive = activeLayer === 'A' ? bgLayerA : bgLayerB;
        const newActive = getInactiveLayer();
        oldActive.classList.remove('active');
        oldActive.classList.add('inactive');
        newActive.classList.remove('inactive');
        newActive.classList.add('active');
        activeLayer = activeLayer === 'A' ? 'B' : 'A';
    }
    window.randomChangeBackground = function() {
        if (isChanging) return;
        const imgUrl = getRandomImage();
        if (!imgUrl) return;
        isChanging = true;
        const img = new Image();
        img.onload = () => {
            const inactive = getInactiveLayer();
            inactive.style.backgroundImage = `url('${imgUrl}')`;
            switchActiveLayer();
            isChanging = false;
        };
        img.onerror = () => {
            console.warn('背景图加载失败', imgUrl);
            isChanging = false;
        };
        img.src = imgUrl;
    };
})();
</script>

        let tag;
        if (type === "css") {
            tag = document.createElement("link");
            tag.rel = "stylesheet";
            tag.href = url;
        } else if (type === "js") {
            tag = document.createElement("script");
            tag.src = url;

            tag.onerror = () => reject(url);

<script>
(function() {
    const MOBILE_DIR = "phone";
    const REMEMBER_CANCEL_SESSION = true;
    function getMobileFileName(originalFileName) {
        if (!originalFileName) return "index（优化）.html";
        let nameWithoutExt = originalFileName.replace(/\.html$/i, "");
        if (nameWithoutExt === originalFileName) return nameWithoutExt + "（优化）.html";
        return nameWithoutExt + "（优化）.html";
    }
    function getCurrentFileName() {
        let path = window.location.pathname;
        let lastSlash = path.lastIndexOf('/');
        let fileName = lastSlash !== -1 ? path.substring(lastSlash + 1) : path;
        if (!fileName || fileName === "") fileName = "index.html";
        let questionMark = fileName.indexOf('?');
        if (questionMark !== -1) fileName = fileName.substring(0, questionMark);
        return fileName;
    }
    function isMobileDevice() {
        const ua = navigator.userAgent;
        const mobileRegex = /(?:Android|webOS|iPhone|iPad|iPod|BlackBerry|Windows Phone|Opera Mini|IEMobile|Mobile|Silk|Kindle)/i;
        const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 2);
        const isIPad = /iPad/i.test(ua) || (/Macintosh/i.test(ua) && hasTouch);
        if (isIPad) return true;
        if (mobileRegex.test(ua)) return true;
        if (hasTouch && window.innerWidth <= 900) return true;
        return false;
    }
    if (!isMobileDevice()) return;
    let targetUrl = (() => {
        if (window.location.pathname.includes(`/${MOBILE_DIR}/`)) return null;
        let currentFile = getCurrentFileName();
        let mobileFile = getMobileFileName(currentFile);
        let basePath = "";
        if (window.location.protocol === "file:") {
            let fullPath = window.location.pathname;
            let lastSlash = fullPath.lastIndexOf('/');
            basePath = lastSlash !== -1 ? fullPath.substring(0, lastSlash + 1) : "";
        } else {
            let currentUrl = window.location.href;
            let lastSlash = currentUrl.lastIndexOf('/');
            basePath = lastSlash !== -1 ? currentUrl.substring(0, lastSlash + 1) : currentUrl;
        }
        return basePath + MOBILE_DIR + "/" + mobileFile;
    })();
    if (!targetUrl) return;
    const SESSION_KEY = 'skip_mobile_redirect';
    if (REMEMBER_CANCEL_SESSION && sessionStorage.getItem(SESSION_KEY) === 'true') return;
    if (confirm("📱 检测到您使用手机访问，是否跳转至手机优化版页面？\n\n“确定”跳转，“取消”继续浏览当前页面。")) {
        window.location.href = targetUrl;
    } else {
        if (REMEMBER_CANCEL_SESSION) sessionStorage.setItem(SESSION_KEY, 'true');
    }
})();
</script>

    const moonSvg = '<svg aria-hidden="true" focusable="false" height="16" role="presentation" viewBox="0 0 24 24" width="16" class="theme-icon"><g fill="currentColor"><path d="M21.752 15.002A9.718 9.718 0 0112 21a9.75 9.75 0 110-19.5c.535 0 1.054.045 1.563.13a.75.75 0 01.346 1.298 7.25 7.25 0 009.551 9.551.75.75 0 011.298.346 9.72 9.72 0 01-.13 1.563z"/><path d="M12 2a10 10 0 1010 10c0-1.05-.16-2.062-.46-3.01a8.5 8.5 0 01-7.53 7.53 9.968 9.968 0 01-2.01-4.03 8.5 8.5 0 015.49-5.49A9.967 9.967 0 0112 2z"/></g></svg>';
    
    const allThemeButtons = Array.from(document.querySelectorAll('button[role="switch"]')).filter(btn => btn.querySelector('.theme-icon'));
    
    function updateAllButtonsTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        const targetSvgHtml = isDark ? moonSvg : sunSvg;
        const checkedState = isDark;
        allThemeButtons.forEach(btn => {
            const iconSpan = btn.querySelector('span');
            if (iconSpan) {
                const svgElement = iconSpan.querySelector('.theme-icon');
                if (svgElement) {
                    const newSvg = document.createElement('div');
                    newSvg.innerHTML = targetSvgHtml;
                    const newSvgElem = newSvg.firstChild;
                    if (newSvgElem) {
                        svgElement.parentNode?.replaceChild(newSvgElem, svgElement);
                    }
                }
            }
            btn.setAttribute('aria-checked', checkedState ? 'true' : 'false');
            btn.setAttribute('data-state', checkedState ? 'checked' : 'unchecked');
            const innerSpan = btn.querySelector('span[data-state]');
            if (innerSpan) innerSpan.setAttribute('data-state', checkedState ? 'checked' : 'unchecked');
        });
    }
    
    function setTheme(theme) {
        const root = document.documentElement;
        const newTheme = theme === 'dark' ? 'dark' : 'light';
        if (root.classList.contains(newTheme)) return;
        root.classList.remove('light', 'dark');
        root.classList.add(newTheme);
        root.style.colorScheme = newTheme;
        localStorage.setItem('theme', newTheme);
        updateAllButtonsTheme();
        window.dispatchEvent(new CustomEvent('themeChanged', { detail: { theme: newTheme } }));
    }
    
    function toggleTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        setTheme(isDark ? 'light' : 'dark');
    }
    
    function initThemeButtons() {
        updateAllButtonsTheme();
        allThemeButtons.forEach(btn => {
            btn.removeEventListener('click', toggleTheme);
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                toggleTheme();
            });
        });
    }
    
    window.addEventListener('storage', (e) => {
        if (e.key === 'theme') {
            const newTheme = e.newValue || 'light';
            const root = document.documentElement;
            if (newTheme === 'dark' && !root.classList.contains('dark')) {
                root.classList.remove('light', 'dark');
                root.classList.add('dark');
                root.style.colorScheme = 'dark';
                updateAllButtonsTheme();
            } else if (newTheme === 'light' && !root.classList.contains('light')) {
                root.classList.remove('light', 'dark');
                root.classList.add('light');
                root.style.colorScheme = 'light';
                updateAllButtonsTheme();
            }
        }
    });
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initThemeButtons);
    } else {
        initThemeButtons();
    }
})();
</script>

<script>
(function() {
    const PAGES = [
        { url: 'index.html', title: '🏠 首页' },
        { url: '游戏.html', title: '🎲 游戏' },
        { url: '动漫.html', title: '📺 动漫' },
        { url: '杂乱.html', title: '📂 杂乱' },
        { url: '动漫相关.html', title: '动漫相关' },
        { url: '小说网址.html', title: '小说网址' },
        { url: '软件（手机）.html', title: '软件（手机）' },
        { url: '软件（pc）.html', title: '软件（pc）' },
        { url: '一些神奇网页.html', title: '一些神奇网页' },
    ];

    const searchInput = document.querySelector('input[type="search"]');
    if (!searchInput) return;

    let dropdown = null;
    let currentSearchAbort = null;
    let debounceTimer = null;

    function ensureDropdown() {
        if (dropdown) return dropdown;
        dropdown = document.createElement('div');
        dropdown.className = 'search-dropdown';
        let wrapper = searchInput.closest('.relative');
        if (!wrapper) {
            wrapper = searchInput.parentNode;
            wrapper.style.position = 'relative';
        }
        wrapper.appendChild(dropdown);
        return dropdown;
    }

    function hideDropdown() {
        if (dropdown) dropdown.style.display = 'none';
    }

    function showLoading() {
        ensureDropdown();
        dropdown.innerHTML = '<div class="search-dropdown-item" style="text-align:center;">🔍 正在搜索...</div>';
        dropdown.style.display = 'block';
    }

    function showResultList(results, keyword) {
        ensureDropdown();
        if (!results.length) {
            dropdown.innerHTML = `<div class="search-dropdown-item">😢 未找到包含 “${escapeHtml(keyword)}” 的内容</div>`;
            dropdown.style.display = 'block';
            return;
        }
        let html = '';
        results.forEach(res => {
            html += `
                <div class="search-dropdown-item" data-url="${res.url}" data-keyword="${encodeURIComponent(keyword)}">
                    <div class="search-dropdown-title">${escapeHtml(res.title)}</div>
                    <div class="search-dropdown-snippet">${escapeHtml(res.snippet)}</div>
                </div>
            `;
        });
        dropdown.innerHTML = html;
        dropdown.style.display = 'block';

        dropdown.querySelectorAll('.search-dropdown-item[data-url]').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                const url = item.getAttribute('data-url');
                const kw = decodeURIComponent(item.getAttribute('data-keyword'));
                window.location.href = `${url}?search=${encodeURIComponent(kw)}`;
            });
        });
    }

    async function checkPageMatch(url, keyword) {
        try {
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) return null;
            const html = await res.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            doc.querySelectorAll('script, style, noscript').forEach(el => el.remove());
            const bodyText = doc.body.innerText || '';
            const lowerText = bodyText.toLowerCase();
            const lowerKeyword = keyword.toLowerCase();
            if (!lowerText.includes(lowerKeyword)) return null;
            const idx = lowerText.indexOf(lowerKeyword);
            let start = Math.max(0, idx - 35);
            let end = Math.min(bodyText.length, idx + keyword.length + 35);
            let snippet = bodyText.substring(start, end);
            if (start > 0) snippet = '...' + snippet;
            if (end < bodyText.length) snippet = snippet + '...';
            return snippet;
        } catch (err) {
            console.warn(`无法获取 ${url}`, err);
            return null;
        }
    }

    async function performSearch(keyword) {
        if (!keyword.trim()) {
            hideDropdown();
            return;
        }
        if (currentSearchAbort) currentSearchAbort.abort();
        const controller = new AbortController();
        currentSearchAbort = controller;

        showLoading();

        const tasks = PAGES.map(async (page) => {
            const snippet = await checkPageMatch(page.url, keyword);
            if (snippet && !controller.signal.aborted) {
                return { url: page.url, title: page.title, snippet };
            }
            return null;
        });
        const matches = (await Promise.all(tasks)).filter(r => r !== null);
        if (controller.signal.aborted) return;
        currentSearchAbort = null;
        showResultList(matches, keyword);
    }

    function onSearchInput() {
        const keyword = searchInput.value.trim();
        if (debounceTimer) clearTimeout(debounceTimer);
        if (keyword === '') {
            hideDropdown();
            return;
        }
        debounceTimer = setTimeout(() => {
            performSearch(keyword);
        }, 400);
    }

    function onSearchEnter(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const keyword = searchInput.value.trim();
            if (keyword) {
                performSearch(keyword);
            } else {
                hideDropdown();
            }
        }
    }

    document.addEventListener('click', function(e) {
        if (dropdown && !dropdown.contains(e.target) && e.target !== searchInput) {
            hideDropdown();
        }
    });

    searchInput.addEventListener('input', onSearchInput);
    searchInput.addEventListener('keypress', onSearchEnter);

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
})();
</script>
