<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瞄准训练系统 - AimLab Web</title>
    <style>
        :root {
            --bg: #0d0d14;
            --surface: #1a1a28;
            --surface-light: #222236;
            --text: #e0e0e0;
            --text-secondary: #a0a0b8;
            --accent: #ff4455;
            --accent-glow: #ff445566;
            --gold: #ffb347;
            --green: #4cff8d;
            --red: #ff3b3b;
            --border: #2a2a40;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            --font-sans: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
	background: var(--bg);
	font-family: var(--font-sans);
	color: var(--text);
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	overflow: hidden;
	user-select: none;
	-webkit-user-select: none;
	-webkit-tap-highlight-color: transparent;
	background-image: url(images/6.jpg);
			background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            position: relative;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 960px;
            padding: 10px 16px;
        }

        /* 顶部标题栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 4px;
        }
        .header .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: #fff;
            text-transform: uppercase;
        }
        .header .logo span {
            color: var(--accent);
        }
        .header .best-score {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--surface);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            letter-spacing: 0.03em;
        }
        .header .best-score strong {
            color: var(--gold);
            font-family: var(--font-mono);
            font-size: 1rem;
        }

        /* 游戏容器 */
        .game-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            max-height: 520px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border);
            box-shadow:
                0 0 60px rgba(100, 60, 180, 0.15),
                0 0 120px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.03);
            background: #111118;
            cursor: none;
            transition: border-color 0.4s;
        }
        .game-wrapper.playing {
            border-color: #3a3050;
        }
        .game-wrapper.countdown-active {
            border-color: var(--gold);
            box-shadow: 0 0 60px rgba(255, 179, 71, 0.2), 0 0 120px rgba(0, 0, 0, 0.5);
        }
        .game-wrapper.ended {
            border-color: #444;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        /* HUD覆盖层 */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 18px;
            z-index: 10;
        }
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .hud-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .hud-value {
            font-family: var(--font-mono);
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            transition: color 0.3s;
        }
        .hud-value.warning {
            color: #ff6b6b;
            animation: pulse-warning 0.5s ease-in-out infinite;
        }
        .hud-value.combo-flash {
            color: var(--gold);
            animation: combo-pop 0.3s ease-out;
        }
        .hud-combo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-family: var(--font-mono);
            font-size: 3rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 40px rgba(255, 179, 71, 0.8), 0 0 80px rgba(255, 140, 50, 0.5);
            pointer-events: none;
            opacity: 0;
            transition: transform 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.2s;
            z-index: 12;
            letter-spacing: 0.05em;
        }
        .hud-combo.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .hud-combo.super {
            color: #ff3b9b;
            text-shadow: 0 0 50px rgba(255, 59, 155, 0.9), 0 0 100px rgba(255, 80, 150, 0.6);
            font-size: 4rem;
        }

        @keyframes pulse-warning {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }
        @keyframes combo-pop {
            0% {
                transform: translate(-50%, -50%) scale(1.3);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* 菜单面板 */
        .menu-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 28px 24px;
            text-align: center;
            z-index: 20;
            pointer-events: all;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            min-width: 300px;
            backdrop-filter: blur(10px);
        }
        .menu-panel h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.03em;
        }
        .menu-panel .subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        .menu-panel .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .menu-panel button {
            display: block;
            width: 100%;
            padding: 12px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-light);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: all 0.2s;
            font-family: var(--font-sans);
            position: relative;
            overflow: hidden;
        }
        .menu-panel button:hover {
            background: #2d2d48;
            border-color: #555;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .menu-panel button.primary {
            background: var(--accent);
            border-color: var(--accent);
            font-size: 1rem;
            letter-spacing: 0.05em;
        }
        .menu-panel button.primary:hover {
            background: #ff5566;
            border-color: #ff5566;
            box-shadow: 0 8px 30px rgba(255, 68, 85, 0.35);
            transform: translateY(-2px);
        }
        .menu-panel .difficulty-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .menu-panel .diff-btn {
            flex: 1;
            min-width: 55px;
            padding: 8px 10px;
            font-size: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-light);
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        .menu-panel .diff-btn.active {
            background: #2d2d50;
            border-color: #777;
            color: #fff;
            box-shadow: 0 0 12px rgba(150, 130, 220, 0.25);
        }
        .menu-panel .diff-btn:hover {
            border-color: #666;
            color: #fff;
        }

        /* 结束面板 */
        .result-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 26px 22px;
            text-align: center;
            z-index: 20;
            pointer-events: all;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            min-width: 340px;
            backdrop-filter: blur(10px);
            animation: panel-in 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.1);
        }
        @keyframes panel-in {
            0% {
                transform: translate(-50%, -50%) scale(0.85);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
        .result-panel h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.03em;
        }
        .result-panel .result-score {
            font-family: var(--font-mono);
            font-size: 3rem;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 40px var(--accent-glow);
            margin: 8px 0;
            letter-spacing: 0.02em;
        }
        .result-panel .result-score.new-best {
            color: var(--gold);
            text-shadow: 0 0 50px rgba(255, 179, 71, 0.6);
            animation: glow-pulse 1s ease-in-out infinite;
        }
        @keyframes glow-pulse {
            0%,
            100% {
                text-shadow: 0 0 40px rgba(255, 179, 71, 0.5);
            }
            50% {
                text-shadow: 0 0 70px rgba(255, 179, 71, 0.9);
            }
        }
        .result-panel .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 16px 0;
            text-align: center;
        }
        .result-panel .stat-item {
            background: var(--surface-light);
            border-radius: 10px;
            padding: 10px 8px;
            border: 1px solid transparent;
        }
        .result-panel .stat-item .stat-val {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }
        .result-panel .stat-item .stat-lbl {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .result-panel button {
            display: inline-block;
            padding: 11px 28px;
            margin: 4px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-light);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }
        .result-panel button:hover {
            background: #2d2d48;
            border-color: #555;
        }
        .result-panel button.primary {
            background: var(--accent);
            border-color: var(--accent);
        }
        .result-panel button.primary:hover {
            background: #ff5566;
            box-shadow: 0 6px 24px rgba(255, 68, 85, 0.4);
        }

        /* 底部提示 */
        .footer-hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.7;
            letter-spacing: 0.04em;
            text-align: center;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .game-wrapper {
                aspect-ratio: 4/3;
                max-height: 400px;
                border-radius: 12px;
            }
            .hud-overlay {
                padding: 8px 12px;
            }
            .hud-value {
                font-size: 1.2rem;
            }
            .hud-label {
                font-size: 0.6rem;
            }
            .menu-panel {
                min-width: 260px;
                padding: 22px 18px 16px;
                border-radius: 16px;
            }
            .menu-panel h2 {
                font-size: 1.2rem;
            }
            .result-panel {
                min-width: 280px;
                padding: 20px 16px 16px;
                border-radius: 16px;
            }
            .result-panel .result-score {
                font-size: 2.4rem;
            }
            .result-panel .stats-grid {
                gap: 5px;
            }
            .result-panel .stat-item .stat-val {
                font-size: 1rem;
            }
            .hud-combo {
                font-size: 2rem;
            }
            .hud-combo.super {
                font-size: 2.6rem;
            }
        }
        @media (max-width: 480px) {
            .game-wrapper {
                aspect-ratio: 1/1;
                max-height: 340px;
            }
            .menu-panel {
                min-width: 220px;
                padding: 16px 12px 12px;
            }
            .result-panel {
                min-width: 240px;
                padding: 16px 12px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部 -->
        <div class="header">
            <div class="logo">🎯 练<span>枪</span></div>
            <div class="best-score" id="bestScoreDisplay">
                🏆 最佳: <strong id="bestScoreVal">0</strong>
            </div>
        </div>

        <!-- 游戏容器 -->
        <div class="game-wrapper" id="gameWrapper">
            <canvas id="gameCanvas"></canvas>
            <!-- HUD -->
            <div class="hud-overlay" id="hudOverlay">
                <div class="hud-item">
                    <span class="hud-label">得分</span>
                    <span class="hud-value" id="hudScore">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">时间</span>
                    <span class="hud-value" id="hudTime">60</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">命中率</span>
                    <span class="hud-value" id="hudAccuracy">100%</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">连击</span>
                    <span class="hud-value" id="hudCombo">0</span>
                </div>
            </div>
            <!-- 大号连击显示 -->
            <div class="hud-combo" id="hudBigCombo"></div>

            <!-- 菜单面板 -->
            <div class="menu-panel" id="menuPanel">
                <h2>🎯 瞄准训练</h2>
                <p class="subtitle">选择难度，开始训练</p>
                <div class="difficulty-row" id="difficultyRow">
                    <button class="diff-btn" data-diff="easy">🟢 简单</button>
                    <button class="diff-btn active" data-diff="normal">🟡 普通</button>
                    <button class="diff-btn" data-diff="hard">🔴 困难</button>
                    <button class="diff-btn" data-diff="expert">💀 专家</button>
                </div>
                <div class="mode-buttons">
                    <button class="primary" id="btnStart30">⚡ 快速模式 (30秒)</button>
                    <button class="primary" id="btnStart60" style="background:#7c3aed;border-color:#7c3aed;">🎯 标准模式 (60秒)</button>
                </div>
            </div>

            <!-- 结束面板（初始隐藏） -->
            <div class="result-panel" id="resultPanel" style="display:none;">
                <h2 id="resultTitle">训练结束</h2>
                <div class="result-score" id="resultScore">0</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-val" id="resHits">0</div>
                        <div class="stat-lbl">命中</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-val" id="resMisses">0</div>
                        <div class="stat-lbl">失误</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-val" id="resAccuracy">0%</div>
                        <div class="stat-lbl">准确率</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-val" id="resAvgRT">0ms</div>
                        <div class="stat-lbl">平均反应</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-val" id="resMaxCombo">0</div>
                        <div class="stat-lbl">最大连击</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-val" id="resBestLabel">-</div>
                        <div class="stat-lbl" id="resBestSublabel">最佳成绩</div>
                    </div>
                </div>
                <button class="primary" id="btnRetry">🔄 再来一次</button>
                <button id="btnMenu">📋 返回菜单</button>
            </div>
        </div>
        <div class="footer-hint">点击目标球体得分 · 连击获得额外加成 · 按 <strong>ESC</strong> 可提前结束</div>
    </div>

<script>
        (function() {
            // ==================== DOM 元素 ====================
            const gameWrapper = document.getElementById('gameWrapper');
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const menuPanel = document.getElementById('menuPanel');
            const resultPanel = document.getElementById('resultPanel');
            const hudOverlay = document.getElementById('hudOverlay');
            const hudScore = document.getElementById('hudScore');
            const hudTime = document.getElementById('hudTime');
            const hudAccuracy = document.getElementById('hudAccuracy');
            const hudCombo = document.getElementById('hudCombo');
            const hudBigCombo = document.getElementById('hudBigCombo');
            const bestScoreVal = document.getElementById('bestScoreVal');
            const difficultyRow = document.getElementById('difficultyRow');

            // 结果面板元素
            const resultTitle = document.getElementById('resultTitle');
            const resultScore = document.getElementById('resultScore');
            const resHits = document.getElementById('resHits');
            const resMisses = document.getElementById('resMisses');
            const resAccuracy = document.getElementById('resAccuracy');
            const resAvgRT = document.getElementById('resAvgRT');
            const resMaxCombo = document.getElementById('resMaxCombo');
            const resBestLabel = document.getElementById('resBestLabel');
            const resBestSublabel = document.getElementById('resBestSublabel');

            // ==================== 音效系统 ====================
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playSound(freqStart, freqEnd, duration, volume = 0.25, type = 'sine') {
                if (!audioCtx) return;
                try {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(freqStart, now);
                    if (freqEnd !== freqStart) {
                        osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 20), now + duration);
                    }
                    gain.gain.setValueAtTime(volume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    osc.start(now);
                    osc.stop(now + duration);
                } catch (e) {
                    // 静默处理
                }
            }

            function sfxHit() { playSound(900, 500, 0.08, 0.22, 'sine');
                playSound(300, 150, 0.05, 0.1, 'triangle'); }

            function sfxMiss() { playSound(150, 60, 0.12, 0.12, 'square'); }

            function sfxCombo(level) {
                const freq = 600 + level * 80;
                playSound(freq, freq * 1.5, 0.1, 0.2, 'sine');
                if (level >= 10) playSound(freq * 1.3, freq * 2, 0.08, 0.15, 'triangle');
            }

            function sfxCountdown() { playSound(500, 700, 0.1, 0.15, 'sine'); }

            function sfxGameOver() { playSound(400, 80, 0.4, 0.25, 'sawtooth');
                playSound(200, 40, 0.35, 0.2, 'triangle'); }

            function sfxNewBest() {
                playSound(600, 1200, 0.15, 0.3, 'sine');
                setTimeout(() => playSound(800, 1400, 0.15, 0.3, 'sine'), 150);
                setTimeout(() => playSound(1000, 1600, 0.2, 0.4, 'sine'), 300);
            }

            // ==================== 游戏状态 ====================
            const STATE = { MENU: 'menu', COUNTDOWN: 'countdown', PLAYING: 'playing', ENDED: 'ended' };
            let gameState = STATE.MENU;
            let difficulty = 'normal';
            let gameDuration = 60; // 秒
            let timeRemaining = 60;
            let score = 0;
            let hits = 0;
            let misses = 0;
            let combo = 0;
            let maxCombo = 0;
            let totalReactionTime = 0;
            let bestScore = 0;
            let isNewBest = false;
            let countdownValue = 0;
            let countdownStartTime = 0;
            let gameStartTime = 0;
            let lastFrameTime = 0;
            let comboFlashTimer = 0;
            let bigComboTimer = 0;

            // 游戏对象
            let targets = [];
            let particles = [];
            let floatingTexts = [];
            let mouseX = 0;
            let mouseY = 0;
            let mouseOnCanvas = false;
            let canvasWidth = 0;
            let canvasHeight = 0;

            // 准星抖动
            let crosshairShake = 0;

            // ==================== 难度设置 ====================
            const difficultySettings = {
                easy: { targetRadiusRatio: 0.055, targetCount: 3, baseScore: 80, comboBonus: 6, label: '简单' },
                normal: { targetRadiusRatio: 0.042, targetCount: 3, baseScore: 100, comboBonus: 10, label: '普通' },
                hard: { targetRadiusRatio: 0.032, targetCount: 4, baseScore: 120, comboBonus: 14, label: '困难' },
                expert: { targetRadiusRatio: 0.024, targetCount: 5, baseScore: 150, comboBonus: 20, label: '专家' },
            };

            function getDifficultyConfig() {
                return difficultySettings[difficulty];
            }

            function getTargetRadius() {
                const cfg = getDifficultyConfig();
                return Math.round(Math.min(canvasWidth, canvasHeight) * cfg.targetRadiusRatio);
            }

            // ==================== Canvas 管理 ====================
            function resizeCanvas() {
                const rect = gameWrapper.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2); // 限制像素比以保持性能
                const newWidth = Math.floor(rect.width);
                const newHeight = Math.floor(rect.height);

                if (canvas.width !== newWidth * dpr || canvas.height !== newHeight * dpr) {
                    canvas.width = newWidth * dpr;
                    canvas.height = newHeight * dpr;
                    canvas.style.width = newWidth + 'px';
                    canvas.style.height = newHeight + 'px';
                    canvasWidth = newWidth;
                    canvasHeight = newHeight;
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.scale(dpr, dpr);
                }
            }

            function getCanvasPos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            // ==================== 目标类 ====================
            class Target {
                constructor(x, y, radius) {
                    this.x = x;
                    this.y = y;
                    this.radius = radius;
                    this.spawnTime = performance.now();
                    this.scale = 0;
                    this.targetScale = 1;
                    this.alive = true;
                    this.hitAnimProgress = 0;
                    // 微小的呼吸动画偏移
                    this.breatheOffset = Math.random() * Math.PI * 2;
                    // 颜色变体
                    this.hueShift = (Math.random() - 0.5) * 20;
                }

                update(now) {
                    // 缩放进入动画
                    const age = (now - this.spawnTime) / 1000;
                    if (age < 0.18) {
                        this.scale = easeOutBack(Math.min(age / 0.18, 1));
                    } else {
                        this.scale = this.targetScale;
                    }
                    // 被击中动画
                    if (this.hitAnimProgress > 0) {
                        this.hitAnimProgress += 0.06;
                        if (this.hitAnimProgress >= 1) {
                            this.alive = false;
                        }
                    }
                }

                contains(px, py) {
                    const dx = px - this.x;
                    const dy = py - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    return dist <= this.radius * this.scale;
                }

                draw(ctx, now) {
                    if (!this.alive && this.hitAnimProgress >= 1) return;
                    const r = this.radius * this.scale;
                    if (r <= 0) return;

                    // 击中外扩动画
                    let extraScale = 1;
                    let alpha = 1;
                    if (this.hitAnimProgress > 0) {
                        extraScale = 1 + this.hitAnimProgress * 2.5;
                        alpha = 1 - this.hitAnimProgress;
                    }

                    const drawR = r * extraScale;
                    const globalAlpha = ctx.globalAlpha;
                    ctx.globalAlpha = Math.max(0, alpha);

                    // 外发光
                    const glowGrad = ctx.createRadialGradient(this.x, this.y, drawR * 0.7, this.x, this.y, drawR * 2.2);
                    glowGrad.addColorStop(0, `hsla(${355 + this.hueShift}, 85%, 55%, 0.55)`);
                    glowGrad.addColorStop(0.5, `hsla(${355 + this.hueShift}, 80%, 40%, 0.2)`);
                    glowGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, drawR * 2.2, 0, Math.PI * 2);
                    ctx.fill();

                    // 主体球体渐变
                    const bodyGrad = ctx.createRadialGradient(
                        this.x - drawR * 0.25, this.y - drawR * 0.3, drawR * 0.08,
                        this.x, this.y, drawR
                    );
                    bodyGrad.addColorStop(0, `hsl(${10 + this.hueShift}, 90%, 72%)`);
                    bodyGrad.addColorStop(0.3, `hsl(${355 + this.hueShift}, 85%, 50%)`);
                    bodyGrad.addColorStop(0.7, `hsl(${350 + this.hueShift}, 70%, 30%)`);
                    bodyGrad.addColorStop(1, `hsl(${340 + this.hueShift}, 60%, 14%)`);
                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, drawR, 0, Math.PI * 2);
                    ctx.fill();

                    // 高光点
                    const highlightGrad = ctx.createRadialGradient(
                        this.x - drawR * 0.3, this.y - drawR * 0.35, drawR * 0.02,
                        this.x - drawR * 0.25, this.y - drawR * 0.28, drawR * 0.4
                    );
                    highlightGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
                    highlightGrad.addColorStop(0.5, 'rgba(255,255,255,0.35)');
                    highlightGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = highlightGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, drawR, 0, Math.PI * 2);
                    ctx.fill();

                    // 边缘细线
                    ctx.strokeStyle = `rgba(255,255,255,${0.15 * alpha})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, drawR, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.globalAlpha = globalAlpha;
                }
            }

            function easeOutBack(t) {
                const c1 = 1.70158;
                const c3 = c1 + 1;
                return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
            }

            // ==================== 粒子类 ====================
            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.vx = (Math.random() - 0.5) * 380;
                    this.vy = (Math.random() - 0.5) * 380;
                    this.life = 0.45 + Math.random() * 0.35;
                    this.maxLife = this.life;
                    this.radius = 1.5 + Math.random() * 3.5;
                    this.color = color;
                    this.alive = true;
                }

                update(dt) {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    this.vy += 300 * dt; // 重力
                    this.life -= dt;
                    if (this.life <= 0) this.alive = false;
                }

                draw(ctx) {
                    const alpha = Math.max(0, this.life / this.maxLife);
                    const r = this.radius * alpha;
                    ctx.fillStyle = this.color.replace('1)', `${alpha})`).replace('rgb',
                        'rgba');
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ==================== 浮动文字类 ====================
            class FloatingText {
                constructor(x, y, text, color = '#fff', size = 16) {
                    this.x = x;
                    this.y = y;
                    this.text = text;
                    this.color = color;
                    this.size = size;
                    this.life = 0.7;
                    this.maxLife = 0.7;
                    this.alive = true;
                }

                update(dt) {
                    this.y -= 60 * dt;
                    this.life -= dt;
                    if (this.life <= 0) this.alive = false;
                }

                draw(ctx) {
                    const alpha = Math.max(0, this.life / this.maxLife);
                    const scale = 1 + (1 - alpha) * 0.3;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.font = `bold ${this.size * scale}px "${getFontFamily()}"`;
                    ctx.textAlign = 'center';
                    ctx.fillText(this.text, this.x, this.y);
                    ctx.restore();
                }
            }

            function getFontFamily() {
                return "'SF Mono','Cascadia Code','Consolas','Monaco','PingFang SC','Microsoft YaHei',monospace";
            }

            // ==================== 游戏逻辑 ====================
            function spawnTarget() {
                const radius = getTargetRadius();
                const margin = radius + 15;
                const cfg = getDifficultyConfig();
                const maxAttempts = 50;

                for (let attempt = 0; attempt < maxAttempts; attempt++) {
                    const x = margin + Math.random() * (canvasWidth - margin * 2);
                    const y = margin + Math.random() * (canvasHeight - margin * 2);

                    // 检查与现有目标的距离
                    let tooClose = false;
                    const minDist = radius * 2.8;
                    for (const t of targets) {
                        if (!t.alive) continue;
                        const dx = t.x - x;
                        const dy = t.y - y;
                        if (Math.sqrt(dx * dx + dy * dy) < minDist + t.radius) {
                            tooClose = true;
                            break;
                        }
                    }
                    if (!tooClose) {
                        const target = new Target(x, y, radius);
                        targets.push(target);
                        return target;
                    }
                }
                // 回退：在随机位置生成
                const x = margin + Math.random() * (canvasWidth - margin * 2);
                const y = margin + Math.random() * (canvasHeight - margin * 2);
                const target = new Target(x, y, radius);
                targets.push(target);
                return target;
            }

            function ensureTargetCount() {
                const cfg = getDifficultyConfig();
                const aliveTargets = targets.filter(t => t.alive);
                const needed = cfg.targetCount - aliveTargets.length;
                for (let i = 0; i < needed; i++) {
                    spawnTarget();
                }
                // 清理死亡目标
                targets = targets.filter(t => t.alive || t.hitAnimProgress < 1);
            }

            function clearAllTargets() {
                targets = [];
                particles = [];
                floatingTexts = [];
            }

            function spawnParticles(x, y, count = 18) {
                const colors = [
                    'rgb(255,80,80)',
                    'rgb(255,150,60)',
                    'rgb(255,200,80)',
                    'rgb(255,255,200)',
                    'rgb(255,100,100)',
                ];
                for (let i = 0; i < count; i++) {
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particles.push(new Particle(x, y, color));
                }
            }

            function spawnFloatingText(x, y, text, color = '#fff', size = 16) {
                floatingTexts.push(new FloatingText(x, y, text, color, size));
            }

            function handleHit(target, now) {
                target.hitAnimProgress = 0.01;
                target.targetScale = 0;
                const reactionTime = now - target.spawnTime;
                totalReactionTime += reactionTime;
                hits++;
                combo++;
                if (combo > maxCombo) maxCombo = combo;

                const cfg = getDifficultyConfig();
                const comboBonus = Math.min(combo * cfg.comboBonus, cfg.baseScore * 3);
                const points = cfg.baseScore + comboBonus;
                score += points;

                // 粒子效果
                spawnParticles(target.x, target.y, 14 + Math.min(combo, 20));

                // 浮动文字
                const comboLabel = combo >= 5 ? ` 🔥x${combo}` : '';
                const size = combo >= 15 ? 22 : (combo >= 8 ? 18 : 15);
                const color = combo >= 20 ? '#ff3b9b' : (combo >= 10 ? '#ffb347' : '#ffffff');
                spawnFloatingText(target.x, target.y - 10, `+${points}${comboLabel}`, color, size);

                // 音效
                if (combo >= 10) {
                    sfxCombo(Math.floor(combo / 5));
                } else {
                    sfxHit();
                }

                // 大号连击显示
                if (combo >= 8) {
                    showBigCombo(combo);
                }

                // 连击闪烁
                comboFlashTimer = 0.25;
                crosshairShake = Math.min(combo * 0.8, 18);

                // 生成新目标替代
                const cfg2 = getDifficultyConfig();
                const aliveCount = targets.filter(t => t.alive && t.hitAnimProgress === 0).length;
                if (aliveCount < cfg2.targetCount) {
                    spawnTarget();
                }
            }

            function handleMiss(x, y) {
                misses++;
                combo = 0;
                comboFlashTimer = 0;
                spawnFloatingText(x, y, '✗', '#ff4444', 14);
                spawnParticles(x, y, 6);
                sfxMiss();
                crosshairShake = Math.max(crosshairShake, 6);
            }

            function showBigCombo(count) {
                hudBigCombo.textContent = count >= 25 ? `🔥 ${count}连击!` : `${count}连击!`;
                hudBigCombo.className = 'hud-combo show' + (count >= 20 ? ' super' : '');
                bigComboTimer = 1.2;
                // 强制回流后添加show
                void hudBigCombo.offsetWidth;
                hudBigCombo.className = 'hud-combo show' + (count >= 20 ? ' super' : '');
            }

            function hideBigCombo() {
                hudBigCombo.className = 'hud-combo';
                bigComboTimer = 0;
            }

            // ==================== 渲染 ====================
            function drawBackground() {
                // 背景色
                ctx.fillStyle = '#111118';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                // 网格线
                const gridSize = Math.min(canvasWidth, canvasHeight) / 16;
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 0.5;
                for (let x = gridSize; x < canvasWidth; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvasHeight);
                    ctx.stroke();
                }
                for (let y = gridSize; y < canvasHeight; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvasWidth, y);
                    ctx.stroke();
                }

                // 中心微妙标记
                const cx = canvasWidth / 2;
                const cy = canvasHeight / 2;
                const markerSize = Math.min(canvasWidth, canvasHeight) * 0.04;
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(cx, cy, markerSize, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - markerSize - 10, cy);
                ctx.lineTo(cx + markerSize + 10, cy);
                ctx.moveTo(cx, cy - markerSize - 10);
                ctx.lineTo(cx, cy + markerSize + 10);
                ctx.stroke();
            }

            function drawCrosshair() {
                if (!mouseOnCanvas) return;
                if (gameState !== STATE.PLAYING && gameState !== STATE.COUNTDOWN) return;

                const x = mouseX;
                const y = mouseY;
                const size = 14;
                const gap = 5;
                const shakeX = crosshairShake * (Math.random() - 0.5) * 2;
                const shakeY = crosshairShake * (Math.random() - 0.5) * 2;
                const sx = x + shakeX;
                const sy = y + shakeY;

                ctx.strokeStyle = 'rgba(100,255,180,0.85)';
                ctx.lineWidth = 1.8;
                ctx.shadowColor = 'rgba(100,255,180,0.5)';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                // 上
                ctx.moveTo(sx, sy - gap);
                ctx.lineTo(sx, sy - size);
                // 下
                ctx.moveTo(sx, sy + gap);
                ctx.lineTo(sx, sy + size);
                // 左
                ctx.moveTo(sx - gap, sy);
                ctx.lineTo(sx - size, sy);
                // 右
                ctx.moveTo(sx + gap, sy);
                ctx.lineTo(sx + size, sy);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // 中心点
                ctx.fillStyle = 'rgba(100,255,180,0.9)';
                ctx.beginPath();
                ctx.arc(sx, sy, 2.2, 0, Math.PI * 2);
                ctx.fill();

                // 外圈
                ctx.strokeStyle = 'rgba(100,255,180,0.35)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(sx, sy, size + 4, 0, Math.PI * 2);
                ctx.stroke();
            }

            function drawCountdownOverlay() {
                if (gameState !== STATE.COUNTDOWN) return;
                const elapsed = (performance.now() - countdownStartTime) / 1000;
                const remaining = Math.max(0, countdownValue - elapsed);
                const displayNum = Math.ceil(remaining);

                if (displayNum <= 0) return;
                const alpha = Math.min(1, remaining - Math.floor(remaining));
                const scale = 1 + (1 - alpha) * 0.6;

                ctx.fillStyle = `rgba(0,0,0,0.45)`;
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                ctx.font = `bold ${72 * scale}px "${getFontFamily()}"`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(displayNum.toString(), canvasWidth / 2, canvasHeight / 2);
                ctx.textBaseline = 'alphabetic';
            }

            function render(now) {
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                drawBackground();

                // 绘制目标
                for (const target of targets) {
                    target.draw(ctx, now);
                }

                // 绘制粒子
                for (const particle of particles) {
                    particle.draw(ctx);
                }


                // 绘制浮动文字
                for (const ft of floatingTexts) {
                    ft.draw(ctx);
                }

                // 倒计时覆盖层
                drawCountdownOverlay();

                // 准星
                drawCrosshair();
            }

            // ==================== 游戏循环 ====================
            function update(dt, now) {
                // 更新目标
                for (const target of targets) {
                    target.update(now);
                }

                // 清理死亡目标
                targets = targets.filter(t => t.alive || (t.hitAnimProgress > 0 && t.hitAnimProgress < 1));

                // 更新粒子
                for (const particle of particles) {
                    particle.update(dt);
                }
                particles = particles.filter(p => p.alive);

                // 更新浮动文字
                for (const ft of floatingTexts) {
                    ft.update(dt);
                }
                floatingTexts = floatingTexts.filter(ft => ft.alive);

                // 更新准星抖动
                if (crosshairShake > 0) {
                    crosshairShake = Math.max(0, crosshairShake - dt * 25);
                }

                // 连击闪烁计时器
                if (comboFlashTimer > 0) {
                    comboFlashTimer -= dt;
                }

                // 大号连击计时器
                if (bigComboTimer > 0) {
                    bigComboTimer -= dt;
                    if (bigComboTimer <= 0) {
                        hideBigCombo();
                    }
                }

                // 确保目标数量
                if (gameState === STATE.PLAYING) {
                    ensureTargetCount();
                }

                // 更新时间
                if (gameState === STATE.PLAYING) {
                    const elapsed = (now - gameStartTime) / 1000;
                    timeRemaining = Math.max(0, gameDuration - elapsed);
                    if (timeRemaining <= 0) {
                        endGame();
                    }
                }

                // 更新倒计时
                if (gameState === STATE.COUNTDOWN) {
                    const elapsed = (now - countdownStartTime) / 1000;
                    if (elapsed >= countdownValue) {
                        startPlaying();
                    }
                }

                // 更新HUD
                updateHUD();
            }

            function updateHUD() {
                hudScore.textContent = score.toLocaleString();
                hudTime.textContent = Math.ceil(Math.max(0, timeRemaining));
                const totalShots = hits + misses;
                const accuracy = totalShots > 0 ? Math.round((hits / totalShots) * 100) : 100;
                hudAccuracy.textContent = accuracy + '%';
                hudCombo.textContent = combo;

                // 时间警告
                if (timeRemaining <= 10 && timeRemaining > 0 && gameState === STATE.PLAYING) {
                    hudTime.classList.add('warning');
                } else {
                    hudTime.classList.remove('warning');
                }

                // 连击闪烁
                if (comboFlashTimer > 0 && combo >= 5) {
                    hudCombo.classList.add('combo-flash');
                    setTimeout(() => hudCombo.classList.remove('combo-flash'), 300);
                }
            }

            function gameLoop(timestamp) {
                if (!lastFrameTime) lastFrameTime = timestamp;
                let dt = (timestamp - lastFrameTime) / 1000;
                if (dt <= 0) dt = 0.016;
                if (dt > 0.1) dt = 0.1; // 防止大帧跳跃
                lastFrameTime = timestamp;

                resizeCanvas();
                update(dt, timestamp);
                render(timestamp);

                requestAnimationFrame(gameLoop);
            }

            // ==================== 游戏流程 ====================
            function startCountdown() {
                initAudio();
                gameState = STATE.COUNTDOWN;
                countdownValue = 3;
                countdownStartTime = performance.now();
                score = 0;
                hits = 0;
                misses = 0;
                combo = 0;
                maxCombo = 0;
                totalReactionTime = 0;
                timeRemaining = gameDuration;
                isNewBest = false;
                crosshairShake = 0;
                comboFlashTimer = 0;
                bigComboTimer = 0;
                clearAllTargets();
                hideBigCombo();
                menuPanel.style.display = 'none';
                resultPanel.style.display = 'none';
                hudOverlay.style.display = 'flex';
                gameWrapper.classList.add('countdown-active');
                gameWrapper.classList.remove('playing', 'ended');
                updateHUD();
                hudScore.textContent = '0';
                hudTime.textContent = gameDuration;
                hudAccuracy.textContent = '100%';
                hudCombo.textContent = '0';
                hudTime.classList.remove('warning');
                sfxCountdown();
            }

            function startPlaying() {
                gameState = STATE.PLAYING;
                gameStartTime = performance.now();
                timeRemaining = gameDuration;
                gameWrapper.classList.remove('countdown-active');
                gameWrapper.classList.add('playing');
                gameWrapper.classList.remove('ended');
                clearAllTargets();
                const cfg = getDifficultyConfig();
                for (let i = 0; i < cfg.targetCount; i++) {
                    spawnTarget();
                }
                updateHUD();
            }

            function endGame() {
                gameState = STATE.ENDED;
                gameWrapper.classList.remove('playing', 'countdown-active');
                gameWrapper.classList.add('ended');
                clearAllTargets();
                hideBigCombo();
                crosshairShake = 0;
                comboFlashTimer = 0;
                bigComboTimer = 0;

                // 检查最佳成绩
                isNewBest = false;
                if (score > bestScore) {
                    bestScore = score;
                    isNewBest = true;
                    try {
                        localStorage.setItem('aimlab_best_score', bestScore);
                    } catch (e) {}
                    sfxNewBest();
                } else {
                    sfxGameOver();
                }
                updateBestScoreDisplay();
                showResultPanel();
                hudTime.classList.remove('warning');
            }

            function showResultPanel() {
                const totalShots = hits + misses;
                const accuracy = totalShots > 0 ? Math.round((hits / totalShots) * 100) : 100;
                const avgRT = hits > 0 ? Math.round(totalReactionTime / hits) : 0;

                resultTitle.textContent = isNewBest ? '🏆 新纪录！' : '训练结束';
                resultScore.textContent = score.toLocaleString();
                if (isNewBest) {
                    resultScore.classList.add('new-best');
                } else {
                    resultScore.classList.remove('new-best');
                }
                resHits.textContent = hits;
                resMisses.textContent = misses;
                resAccuracy.textContent = accuracy + '%';
                resAvgRT.textContent = avgRT + 'ms';
                resMaxCombo.textContent = maxCombo;
                resBestLabel.textContent = bestScore.toLocaleString();
                resBestSublabel.textContent = isNewBest ? '🎉 新最佳!' : '历史最佳';

                resultPanel.style.display = 'block';
                hudOverlay.style.display = 'flex';
            }

            function resetToMenu() {
                gameState = STATE.MENU;
                gameWrapper.classList.remove('playing', 'countdown-active', 'ended');
                clearAllTargets();
                hideBigCombo();
                crosshairShake = 0;
                comboFlashTimer = 0;
                bigComboTimer = 0;
                score = 0;
                hits = 0;
                misses = 0;
                combo = 0;
                maxCombo = 0;
                totalReactionTime = 0;
                timeRemaining = gameDuration;
                isNewBest = false;
                menuPanel.style.display = 'block';
                resultPanel.style.display = 'none';
                hudOverlay.style.display = 'none';
                hudScore.textContent = '0';
                hudTime.textContent = gameDuration;
                hudAccuracy.textContent = '100%';
                hudCombo.textContent = '0';
                hudTime.classList.remove('warning');
                updateBestScoreDisplay();
            }

            function updateBestScoreDisplay() {
                bestScoreVal.textContent = bestScore.toLocaleString();
            }

            // ==================== 事件处理 ====================
            canvas.addEventListener('mousemove', (e) => {
                const pos = getCanvasPos(e);
                mouseX = pos.x;
                mouseY = pos.y;
                mouseOnCanvas = true;
            });

            canvas.addEventListener('mouseenter', () => {
                mouseOnCanvas = true;
            });

            canvas.addEventListener('mouseleave', () => {
                mouseOnCanvas = false;
            });

            canvas.addEventListener('click', (e) => {
                if (gameState !== STATE.PLAYING) return;
                const pos = getCanvasPos(e);
                const now = performance.now();
                let hitTarget = null;

                // 从后往前检查（后绘制的在上面）
                for (let i = targets.length - 1; i >= 0; i--) {
                    const t = targets[i];
                    if (t.alive && t.hitAnimProgress === 0 && t.contains(pos.x, pos.y)) {
                        hitTarget = t;
                        break;
                    }
                }

                if (hitTarget) {
                    handleHit(hitTarget, now);
                } else {
                    handleMiss(pos.x, pos.y);
                }
            });

            // 触摸事件
            canvas.addEventListener('touchstart', (e) => {
                if (gameState !== STATE.PLAYING) return;
                e.preventDefault();
                const touch = e.touches[0];
                const pos = getCanvasPos(touch);
                mouseX = pos.x;
                mouseY = pos.y;
                mouseOnCanvas = true;
                const now = performance.now();
                let hitTarget = null;

                for (let i = targets.length - 1; i >= 0; i--) {
                    const t = targets[i];
                    if (t.alive && t.hitAnimProgress === 0 && t.contains(pos.x, pos.y)) {
                        hitTarget = t;
                        break;
                    }
                }

                if (hitTarget) {
                    handleHit(hitTarget, now);
                } else {
                    handleMiss(pos.x, pos.y);
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const pos = getCanvasPos(touch);
                mouseX = pos.x;
                mouseY = pos.y;
            }, { passive: false });

            canvas.addEventListener('touchend', () => {
                // 保持mouseOnCanvas一段时间
            });

            // 窗口调整
            window.addEventListener('resize', () => {
                resizeCanvas();
                // 调整目标位置确保在可见区域内
                const margin = getTargetRadius() + 15;
                for (const t of targets) {
                    if (!t.alive) continue;
                    t.x = Math.max(margin, Math.min(canvasWidth - margin, t.x));
                    t.y = Math.max(margin, Math.min(canvasHeight - margin, t.y));
                }
            });

            // ESC 提前结束
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (gameState === STATE.PLAYING) {
                        endGame();
                    } else if (gameState === STATE.COUNTDOWN) {
                        resetToMenu();
                    } else if (gameState === STATE.ENDED) {
                        resetToMenu();
                    }
                }
            });

            // ==================== 按钮事件 ====================
            document.getElementById('btnStart30').addEventListener('click', (e) => {
                e.stopPropagation();
                gameDuration = 30;
                timeRemaining = 30;
                startCountdown();
            });

            document.getElementById('btnStart60').addEventListener('click', (e) => {
                e.stopPropagation();
                gameDuration = 60;
                timeRemaining = 60;
                startCountdown();
            });

            document.getElementById('btnRetry').addEventListener('click', (e) => {
                e.stopPropagation();
                timeRemaining = gameDuration;
                startCountdown();
            });

            document.getElementById('btnMenu').addEventListener('click', (e) => {
                e.stopPropagation();
                resetToMenu();
            });

            // 难度选择
            difficultyRow.addEventListener('click', (e) => {
                if (e.target.classList.contains('diff-btn')) {
                    const diff = e.target.dataset.diff;
                    if (diff && difficultySettings[diff]) {
                        difficulty = diff;
                        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove(
                            'active'));
                        e.target.classList.add('active');
                    }
                }
            });

            // 防止菜单面板点击冒泡
            menuPanel.addEventListener('click', (e) => {
                e.stopPropagation();
            });
            resultPanel.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            // 点击游戏区域空白处（仅在ENDED状态可点击返回）
            gameWrapper.addEventListener('click', (e) => {
                if (gameState === STATE.ENDED && e.target === gameWrapper) {
                    // 不做什么，让玩家点结果面板
                }
            });

            // ==================== 初始化 ====================
            function init() {
                // 加载最佳成绩
                try {
                    const saved = localStorage.getItem('aimlab_best_score');
                    if (saved !== null) {
                        bestScore = parseInt(saved, 10) || 0;
                    }
                } catch (e) {
                    bestScore = 0;
                }
                updateBestScoreDisplay();

                resizeCanvas();
                resetToMenu();
                hudOverlay.style.display = 'none';
                menuPanel.style.display = 'block';
                resultPanel.style.display = 'none';
                gameWrapper.classList.remove('playing', 'countdown-active', 'ended');

                lastFrameTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            init();

            console.log('🎯 AimLab Web 瞄准训练系统已就绪');
            console.log('   难度: ' + difficultySettings[difficulty].label);
            console.log('   点击目标球体得分 | 连击获得加成 | ESC 提前结束');
            console.log('   支持鼠标和触屏操作');
        })();
    </script>
</body>
</html>
