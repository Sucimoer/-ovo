<script>
(function() {
    function getStoredTheme() { return localStorage.getItem('theme') || 'light'; }
    function applyTheme(theme) {
        const root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.style.colorScheme = theme;
        localStorage.setItem('theme', theme);
        const btns = document.querySelectorAll('button[role="switch"]');
        btns.forEach(btn => {
            const isDark = (theme === 'dark');
            btn.setAttribute('data-state', isDark ? 'checked' : 'unchecked');
            btn.setAttribute('aria-checked', isDark ? 'true' : 'false');
            const span = btn.querySelector('span');
            if (span) {
                let svg = span.querySelector('svg');
                if (!svg) {
                    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('width', '16');
                    svg.setAttribute('viewBox', '0 0 24 24');
                    span.innerHTML = '';
                    span.appendChild(svg);
                }
                if (isDark) {
                    svg.innerHTML = '<path fill="currentColor" d="M12 2a9 9 0 1 0 9 9c0-.46-.04-.92-.12-1.36a7 7 0 1 1-8.52-8.52c-.44-.08-.9-.12-1.36-.12z"/>';

                    svg.innerHTML = '<g fill="currentColor"><path d="M19 12a7 7 0 11-7-7 7 7 0 017 7z"/><path d="M12 22.96a.969.969 0 01-1-.96v-.08a1 1 0 012 0 1.038 1.038 0 01-1 1.04zm7.14-2.82a1.024 1.024 0 01-.71-.29l-.13-.13a1 1 0 011.41-1.41l.13.13a1 1 0 010 1.41.984.984 0 01-.7.29zm-14.28 0a1.024 1.024 0 01-.71-.29 1 1 0 010-1.41l.13-.13a1 1 0 011.41 1.41l-.13.13a1 1 0 01-.7.29zM22 13h-.08a1 1 0 010-2 1.038 1.038 0 011.04 1 .969.969 0 01-.96 1zM2.08 13H2a1 1 0 010-2 1.038 1.038 0 011.04 1 .969.969 0 01-.96 1zm16.93-7.01a1.024 1.024 0 01-.71-.29 1 1 0 010-1.41l.13-.13a1 1 0 011.41 1.41l-.13.13a.984.984 0 01-.7.29zm-14.02 0a1.024 1.024 0 01-.71-.29l-.13-.14a1 1 0 011.41-1.41l.13.13a1 1 0 010 1.41.97.97 0 01-.7.3zM12 3.04a.969.969 0 01-1-.96V2a1 1 0 012 0 1.038 1.038 0 01-1 1.04z"/></g>';
                }
            }
        });
    }
    function toggleTheme() { applyTheme(getStoredTheme() === 'light' ? 'dark' : 'light'); }
    function bindEvents() {
        document.querySelectorAll('button[role="switch"]').forEach(btn => {
            btn.removeEventListener('click', toggleTheme);
            btn.addEventListener('click', toggleTheme);
        });
    }
    applyTheme(getStoredTheme());
    bindEvents();
    new MutationObserver(() => bindEvents()).observe(document.body, { childList: true, subtree: true });
})();

    // 显示当前日期
    function displayCurrentDate() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const day = now.getDate();
        const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const weekday = weekdays[now.getDay()];
        document.getElementById('dateDisplay').innerText = `${year}.${month}.${day} ${weekday} · 宜祈福`;
    }

    // 根据星级生成星星字符串 (starCount: 0-5)
    function renderStars(starCount) {
        const fullStar = '★';
        const emptyStar = '☆';
        let stars = '';
        for (let i = 0; i < 5; i++) {
            stars += (i < starCount) ? fullStar : emptyStar;
        }
        return stars;
    }

    // 图片加载失败时，替换为本地的角色emoji占位符（保证不空白，体验良好）
    function handleImageError(imgElement, characterName) {
        if (!imgElement) return;
        // 避免无限循环: 仅当还没有替换为占位时触发
        if (!imgElement.dataset.fallback) {
            imgElement.dataset.fallback = "true";
            // 制作一个可爱占位字符画data:image
            const canvas = document.createElement("canvas");
            canvas.width = 140;
            canvas.height = 140;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#e4c9a7";
            ctx.fillRect(0, 0, 140, 140);
            ctx.fillStyle = "#b37244";
            ctx.font = "bold 70px 'Segoe UI Emoji'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            // 用角色第一个字或emoji
            let emoji = "✨";
            if (characterName.includes("鸣人")) emoji = "🍥";
            else if (characterName.includes("路飞")) emoji = "👒";
            else if (characterName.includes("银时")) emoji = "🍡";
            else if (characterName.includes("利威尔")) emoji = "⚔️";
            else if (characterName.includes("悟空")) emoji = "🐉";
            else if (characterName.includes("琦玉")) emoji = "👊";
            else if (characterName.includes("阿尔托莉雅")) emoji = "🗡️";
            else if (characterName.includes("龙猫")) emoji = "🍃";
            else if (characterName.includes("炭治郎")) emoji = "🌊";
            else if (characterName.includes("五条悟")) emoji = "👁️";
            else if (characterName.includes("艾伦")) emoji = "⚙️";
            else if (characterName.includes("鲁路修")) emoji = "♟️";
            else if (characterName.includes("纳兹")) emoji = "🔥";
            else if (characterName.includes("柯南")) emoji = "🔍";
            else if (characterName.includes("哆啦A梦")) emoji = "🍩";
            else if (characterName.includes("夜斗")) emoji = "⚡";
            else emoji = "🌟";
            ctx.fillText(emoji, 70, 70);
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                imgElement.src = url;
                imgElement.classList.add("error-load");
                // 释放blob url 延迟
                setTimeout(() => URL.revokeObjectURL(url), 100);
            });
        }
    }

    // 更新卡片所有内容（包括真实图片，运势，语录）
    function updateUIByCharacter(character) {
        if (!character) return;

        // 1. 头像真实图片（网络图片）
        const imgElement = document.getElementById('characterImg');
        // 重置fallback标记和class
        delete imgElement.dataset.fallback;
        imgElement.classList.remove("error-load");
        imgElement.src = character.imageUrl;
        // 添加错误处理
        imgElement.onerror = () => {
            handleImageError(imgElement, character.name);
        };
        // 预置alt
        imgElement.alt = `${character.name} 动漫形象`;

        // 2. 角色名
        document.getElementById('charName').innerText = character.name;

        // 3. 运势等级 & 星级
        document.getElementById('fortuneLevel').innerText = character.fortuneLevel;
        const starHtml = renderStars(character.starCount);
        document.getElementById('starRating').innerHTML = starHtml;

        // 4. 主签诗句
        document.getElementById('signPoem').innerHTML = `「 ${character.signPoem} 」`;

        // 5. 运势详细描述 (融合原示例的一些经典风格 + 专属运势)
        let extraFortuneNote = "";
        switch(character.fortuneLevel) {
            case "大吉":
                extraFortuneNote = "名誉良好，信用亦佳，步步高升，诸事顺心。";
                break;
            case "中吉":
                extraFortuneNote = "安稳余庆福禄开，天赐福缘，注意品行福乐享。";
                break;
            case "小吉":
                extraFortuneNote = "小有波折终能化解，甜果必来，保持乐观。";
                break;
            case "末吉":
                extraFortuneNote = "内含哀兆应谨慎，但坚守本心，亦可转危为安。";
                break;
            default:
                extraFortuneNote = "心诚则灵，善意累积福德。";
        }
        const finalDetail = `${character.fortuneDetail}  ${extraFortuneNote}`;
        document.getElementById('fortuneDetail').innerHTML = finalDetail;

        // 6. 动漫人物名言
        document.getElementById('quoteText').innerHTML = `“${character.quote}”`;
        document.getElementById('quoteAuthor').innerHTML = `—— ${character.name}`;
    }

    // 随机获取角色
    function getRandomCharacter() {
        const randomIndex = Math.floor(Math.random() * characters.length);
        return characters[randomIndex];
    }

    // 刷新运势（随机推荐新人物、真实图片、运势、语录）
    let currentCharacter = null;
    function refreshRandomFortune() {
        const newChar = getRandomCharacter();
        currentCharacter = newChar;
        updateUIByCharacter(currentCharacter);
        // 抽签微动效
        const card = document.querySelector('.card');
        card.style.transform = 'scale(0.98)';
        setTimeout(() => {
            card.style.transform = '';
        }, 150);
    }

    // 初始化页面
    function init() {
        displayCurrentDate();
        const initChar = getRandomCharacter();
        currentCharacter = initChar;
        updateUIByCharacter(currentCharacter);
        // 绑定随机按钮事件
        const randomBtn = document.getElementById('randomBtn');
        randomBtn.addEventListener('click', refreshRandomFortune);
    }

    // 启动所有
    init();
</script>
