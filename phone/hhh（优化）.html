<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>资源导航 - 澪鸢</title>
    <link rel="icon" href="images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
	background-image: url(../images/6.jpg);
	background-size: cover;
	background-attachment: fixed;
        }
        body::before { content: ""; position: fixed; inset: 0; background: rgba(255,248,240,0.28); pointer-events: none; z-index: 0; }
        html.dark body::before { background: rgba(8,8,16,0.82); backdrop-filter: blur(1px); }
        nav, main { position: relative; z-index: 2; }
        .result-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(6px); border-radius: 1.25rem; transition: transform 0.15s; }
        html.dark .result-card { background: rgba(20,20,36,0.88); }
        .result-card:active { transform: scale(0.99); }
        @media (max-width: 768px) { .mobile-auto-height { height: auto !important; overflow-y: visible !important; } }
    </style>
</head>
<body class="antialiased">
<div class="relative flex min-h-screen flex-col">
    <nav class="fixed top-0 w-full bg-white/80 dark:bg-black/80 backdrop-blur-lg border-b z-50">
        <div class="mx-auto flex min-h-[56px] items-center justify-between px-4">
            <a href="index（优化）.html" class="font-bold">澪鸢ovo</a>
          <ul class="flex gap-3 text-sm"><li><a href="游戏（优化）.html">游戏</a></li><li><a href="动漫（优化）.html">动漫</a></li><li><a href="杂乱（优化）.html">杂乱</a></li></ul>
            <button type="button" role="switch" class="theme-switch">🌙</button>
        </div>
    </nav>
    <main class="container mx-auto px-4 pt-20 pb-8">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-[2fr_1fr]">
            <div class="space-y-3">
                <div class="result-card p-4"><a href="gal（优化）.html" class="text-blue-600 font-semibold block py-1">galgame</a></div>
                <div class="result-card p-4"><a href="还没做好" class="text-blue-600 font-semibold block py-1">软件</a></div>
                <div class="result-card p-4"><a href="https://soutubot.moe/" class="text-blue-600 font-semibold block py-1">截图查本子</a></div>
            </div>
            <div class="hidden md:block"><div class="gradient-text text-4xl font-bold">澪鸢ovo</div></div>
        </div>
    </main>
</div>
<script>
    (function(){
        let theme=localStorage.getItem('theme')||'light';
        const root=document.documentElement;
        const apply=(t)=>{root.classList.remove('light','dark');root.classList.add(t);root.style.colorScheme=t;localStorage.setItem('theme',t);document.querySelector('button[role="switch"]').innerHTML=t==='dark'?'☀️':'🌙';};
        apply(theme);
        document.querySelector('button[role="switch"]').addEventListener('click',()=>apply(theme==='light'?'dark':'light'));
    })();
</script>
</body>
</html>
