        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-image: url(../images/%E6%89%8B%E6%9C%BA%E4%B8%BB%E8%83%8C%E6%99%AF.jpeg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
                background-size: cover;
                background-position: center center;
            }
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            transition: background-color 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        html.light body::before {
            background-color: rgba(255, 248, 240, 0.28);
        }
        html.dark body::before {
            background-color: rgba(8, 8, 16, 0.82);
            backdrop-filter: blur(1px);
        }
        nav, main, footer, .relative, .container {
            position: relative;
            z-index: 2;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .result-card {
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            background-color: rgba(255, 255, 255, 0.92) !important;
            backdrop-filter: blur(6px);
            border-radius: 1.25rem;
        }
        html.dark .result-card {
            background-color: rgba(20, 20, 36, 0.88) !important;
        }
        .result-card:active { transform: scale(0.99); }
        .gradient-text {
            background-image: linear-gradient(to bottom, #FF72E1, #F54C7A);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        html.dark .gradient-text {
            background-image: linear-gradient(135deg, #FFA0D0, #FF6A88);
        }
        @media (max-width: 768px) {
            .mobile-auto-height { height: auto !important; overflow-y: visible !important; }
            .result-link { display: block; padding: 0.75rem 0; font-weight: 500; }
        }
        .nav-touch { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
    </style>

</audio>
<script>
    (function() {
        function getCurrentTheme() {
            return localStorage.getItem('theme') || 'light';
        }
        function applyTheme(theme) {
            const root = document.documentElement;
            root.classList.remove('light', 'dark');
            root.classList.add(theme);
            root.style.colorScheme = theme;
            localStorage.setItem('theme', theme);
            const btns = document.querySelectorAll('button[role="switch"]');
            btns.forEach(btn => {
                const isDark = (theme === 'dark');
                btn.setAttribute('aria-checked', isDark ? 'true' : 'false');
                const span = btn.querySelector('span');
                if (span) {
                    let svg = span.querySelector('svg');
                    if (!svg) {
                        svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        svg.setAttribute('width', '16');
                        svg.setAttribute('viewBox', '0 0 24 24');
                        span.innerHTML = '';
                        span.appendChild(svg);
                    }
                    if (isDark) {
                        svg.innerHTML = '<path fill="currentColor" d="M12 2a9 9 0 1 0 9 9c0-.46-.04-.92-.12-1.36a7 7 0 1 1-8.52-8.52c-.44-.08-.9-.12-1.36-.12z"/>';
                    } else {
                        svg.innerHTML = '<g fill="currentColor"><path d="M19 12a7 7 0 11-7-7 7 7 0 017 7z"/><path d="M12 22.96a.969.969 0 01-1-.96v-.08a1 1 0 012 0 1.038 1.038 0 01-1 1.04zm7.14-2.82a1.024 1.024 0 01-.71-.29l-.13-.13a1 1 0 011.41-1.41l.13.13a1 1 0 010 1.41.984.984 0 01-.7.29zm-14.28 0a1.024 1.024 0 01-.71-.29 1 1 0 010-1.41l.13-.13a1 1 0 011.41 1.41l-.13.13a1 1 0 01-.7.29zM22 13h-.08a1 1 0 010-2 1.038 1.038 0 011.04 1 .969.969 0 01-.96 1zM2.08 13H2a1 1 0 010-2 1.038 1.038 0 011.04 1 .969.969 0 01-.96 1zm16.93-7.01a1.024 1.024 0 01-.71-.29 1 1 0 010-1.41l.13-.13a1 1 0 011.41 1.41l-.13.13a.984.984 0 01-.7.29zm-14.02 0a1.024 1.024 0 01-.71-.29l-.13-.14a1 1 0 011.41-1.41l.13.13a1 1 0 010 1.41.97.97 0 01-.7.3zM12 3.04a.969.969 0 01-1-.96V2a1 1 0 012 0 1.038 1.038 0 01-1 1.04z"/></g>';
                    }
                }
            });
        }
        function toggleTheme() {
            const current = getCurrentTheme();
            applyTheme(current === 'light' ? 'dark' : 'light');
        }
        function bindEvents() {
            document.querySelectorAll('button[role="switch"]').forEach(btn => {
                btn.removeEventListener('click', toggleTheme);
                btn.addEventListener('click', toggleTheme);
            });
        }
        applyTheme(getCurrentTheme());
        bindEvents();
        new MutationObserver(() => bindEvents()).observe(document.body, { childList: true, subtree: true });
    })();
    const audio = document.getElementById('bgMusic');
    if (audio) {
        audio.muted = true;
        audio.play().catch(e => console.log('等待用户交互'));
        function enableAudio() {
            if (audio && audio.muted) {
                audio.muted = false;
                audio.volume = 0.7;
                audio.play().catch(e => console.warn('播放失败', e));
                document.removeEventListener('click', enableAudio);
                document.removeEventListener('touchstart', enableAudio);
            }
        }
        document.addEventListener('click', enableAudio);
        document.addEventListener('touchstart', enableAudio);
    }
</script>
