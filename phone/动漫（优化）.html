<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>动漫导航 - 澪鸢</title>
    <link rel="icon" href="images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url(images/6.jpg); background-size: cover; background-attachment: fixed;
        }
        body::before { content: ""; position: fixed; inset: 0; background: rgba(255,248,240,0.28); pointer-events: none; z-index: 0; }
        html.dark body::before { background: rgba(8,8,16,0.82); backdrop-filter: blur(1px); }
        .result-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(6px); border-radius: 1.25rem; }
        .result-card:active { transform: scale(0.99); }
        @media (max-width: 768px) { .mobile-auto-height { height: auto !important; } }
    </style>
</head>
<body>
<div class="relative min-h-screen flex flex-col">
    <nav class="fixed top-0 w-full bg-white/80 dark:bg-black/80 backdrop-blur-lg border-b z-50">
        <div class="flex items-center justify-between px-4 h-14 max-w-7xl mx-auto">
            <a href="index.html" class="font-bold">澪鸢ovo</a>
            <ul class="flex gap-4 text-sm"><li><a href="游戏.html">游戏</a></li><li><a href="动漫.html">动漫</a></li><li><a href="杂乱.html">杂乱</a></li></ul>
            <button role="switch" class="theme-switch">🌙</button>
        </div>
    </nav>
    <main class="container mx-auto px-4 pt-20 pb-8">
        <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
            <div class="space-y-3">
                <div class="result-card p-4"><a href="https://www.bilibili.com/" target="_blank" class="text-blue-600 font-medium block">哔哩哔哩</a></div>
                <div class="result-card p-4"><a href="https://www.acgndog.com/" target="_blank" class="text-blue-600 font-medium block">次元狗</a></div>
                <div class="result-card p-4"><a href="https://www.odcoc.net/" target="_blank" class="text-blue-600 font-medium block">樱花</a></div>
            </div>
            <div class="hidden md:block text-right"><div class="gradient-text text-3xl font-bold">澪鸢ovo</div></div>
        </div>
    </main>
</div>
<script>
    (function(){
        let theme=localStorage.getItem('theme')||'light';
        const root=document.documentElement;
        function setTheme(t){root.classList.remove('light','dark');root.classList.add(t);root.style.colorScheme=t;localStorage.setItem('theme',t);document.querySelector('[role="switch"]').innerHTML=t==='dark'?'☀️':'🌙';}
        setTheme(theme);
        document.querySelector('[role="switch"]').addEventListener('click',()=>setTheme(theme==='light'?'dark':'light'));
    })();
</script>
</body>
</html>
