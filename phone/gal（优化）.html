<!DOCTYPE html>
<html lang="zh-CN" class="light" style="color-scheme: light;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>澪鸢 · Galgame资源</title>
    <link rel="icon" href="images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-image: url(../images/%E6%89%8B%E6%9C%BA%E4%B8%BB%E8%83%8C%E6%99%AF.jpeg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
                background-size: cover;
                background-position: center center;
            }
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            transition: background-color 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        html.light body::before { background-color: rgba(255, 248, 240, 0.28); }
        html.dark body::before { background-color: rgba(8, 8, 16, 0.82); backdrop-filter: blur(1px); }
        nav, main, footer, .relative, .container { position: relative; z-index: 2; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .result-card {
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            background-color: rgba(255, 255, 255, 0.92) !important;
            backdrop-filter: blur(6px);
            border-radius: 1.25rem;
        }
        html.dark .result-card { background-color: rgba(20, 20, 36, 0.88) !important; }
        .result-card:active { transform: scale(0.99); }
        .gradient-text {
            background-image: linear-gradient(to bottom, #FF72E1, #F54C7A);
            background-clip: text; -webkit-background-clip: text; color: transparent;
        }
        html.dark .gradient-text { background-image: linear-gradient(135deg, #FFA0D0, #FF6A88); }
        @media (max-width: 768px) {
            .mobile-auto-height { height: auto !important; overflow-y: visible !important; }
            .result-link { display: block; padding: 0.75rem 0; font-weight: 500; }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased">
<div class="relative flex min-h-screen flex-col">
    <nav class="bg-background/90 fixed top-0 left-0 z-50 w-full border-b backdrop-blur-lg transition-colors">
        <div class="mx-auto flex min-h-[56px] max-w-[1280px] items-center justify-between gap-2 px-4 sm:px-6">
            <a class="flex items-center gap-1.5 py-2" href="index（优化）.html"><span class="text-base font-bold">澪鸢ovo</span></a>
            <ul class="flex flex-wrap items-center justify-center gap-2 sm:gap-4 px-1">
                <li><a class="whitespace-nowrap rounded-full px-3 py-1.5 text-sm font-medium" href="游戏（优化）.html">游戏</a></li>
                <li><a class="whitespace-nowrap rounded-full px-3 py-1.5 text-sm font-medium" href="动漫（优化）.html">动漫</a></li>
                <li><a class="whitespace-nowrap rounded-full px-3 py-1.5 text-sm font-medium" href="杂乱（优化）.html">杂乱</a></li>
            </ul>
            <div class="flex shrink-0 items-center gap-1">
                <a aria-label="Github" href="https://github.com/Sucimoer/-ovo" target="_blank" class="nav-btn-touch flex h-10 w-10 items-center justify-center rounded-full">🌐</a>
                <button type="button" role="switch" aria-checked="false" class="theme-switch flex h-10 w-10 items-center justify-center rounded-full">🌙</button>
            </div>
        </div>
    </nav>
    <main class="container mx-auto px-4 py-8 pt-20">
        <div class="grid grid-cols-1 gap-6 md:grid-cols-[2fr_auto_1.2fr] md:gap-8">
            <div class="w-full min-w-0">
                <div class="relative md:h-[680px] md:overflow-y-auto md:pr-2 mobile-auto-height">
                    <div class="flex flex-col gap-4 pb-2">
                        <div class="result-card border p-4">
                            <a href="gal网址（优化）.html" target="_blank" class="text-lg font-semibold text-blue-600 block py-2">网址</a>
                        </div>
                        <div class="result-card border p-4">
                            <a href="还没做好" target="_blank" class="text-lg font-semibold text-blue-600 block py-2">库</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="hidden md:block">
                <div class="sticky top-28"><div class="gradient-text text-4xl font-extrabold">澪鸢<br>ovo</div></div>
            </div>
        </div>
    </main>
</div>
<script>
(function(){
    function getCurrentTheme() {
        return localStorage.getItem('theme') || 'light';
    }
    function applyTheme(theme){
        const root = document.documentElement;
        root.classList.remove('light','dark');
        root.classList.add(theme);
        root.style.colorScheme = theme;
        localStorage.setItem('theme', theme);
        document.querySelectorAll('button[role="switch"]').forEach(btn => {
            const isDark = theme === 'dark';
            btn.setAttribute('aria-checked', isDark ? 'true' : 'false');
            btn.innerHTML = isDark ? '☀️' : '🌙';
        });
    }
    function toggleTheme() {
        const current = getCurrentTheme();
        applyTheme(current === 'light' ? 'dark' : 'light');
    }
    applyTheme(getCurrentTheme());
    document.querySelectorAll('button[role="switch"]').forEach(btn => btn.addEventListener('click', toggleTheme));
})();
</script>
</body>
</html>
