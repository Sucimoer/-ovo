<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>杂乱资源 - 澪鸢</title>
    <link rel="icon" href="images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-image: url(images/6.jpg); background-size: cover; background-attachment: fixed; }
        body::before { content: ""; position: fixed; inset: 0; background: rgba(255,248,240,0.28); pointer-events: none; z-index: 0; }
        html.dark body::before { background: rgba(8,8,16,0.82); backdrop-filter: blur(1px); }
        .result-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(6px); border-radius: 1.25rem; transition: transform 0.15s; }
        .result-card:active { transform: scale(0.99); }
    </style>
</head>
<body>
<div class="relative min-h-screen flex flex-col">
    <nav class="fixed top-0 w-full bg-white/80 dark:bg-black/80 backdrop-blur-lg border-b z-50">
        <div class="mx-auto flex min-h-[56px] max-w-[1280px] items-center justify-between px-4">
            <a href="index.html" class="font-bold">澪鸢ovo</a>
            <ul class="flex gap-4 text-sm"><li><a href="游戏.html">游戏</a></li><li><a href="动漫.html">动漫</a></li><li><a href="杂乱.html">杂乱</a></li></ul>
            <button type="button" role="switch" class="theme-switch w-10 h-10 rounded-full">🌙</button>
        </div>
    </nav>
    <main class="container mx-auto px-4 pt-20 pb-8">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-[2fr_1fr]">
            <div class="space-y-3">
                <div class="result-card p-4"><a href="小说.html" class="text-blue-600 font-medium block">小说与漫画</a></div>
                <div class="result-card p-4"><a href="密码锁.html" class="text-blue-600 font-medium block">hhh</a></div>
                <div class="result-card p-4"><a href="软件.html" class="text-blue-600 font-medium block">软件</a></div>
                <div class="result-card p-4"><a href="一些神奇网页.html" class="text-blue-600 font-medium block">一些神奇网页</a></div>
            </div>
            <div class="hidden md:block"><div class="gradient-text text-4xl font-bold">澪鸢ovo</div></div>
        </div>
    </main>
</div>
<script>
    (function(){
        let theme = localStorage.getItem('theme') || 'light';
        const root = document.documentElement;
        function set(t){ root.classList.remove('light','dark'); root.classList.add(t); root.style.colorScheme=t; localStorage.setItem('theme',t); document.querySelector('[role="switch"]').innerHTML=t==='dark'?'☀️':'🌙'; }
        set(theme);
        document.querySelector('[role="switch"]').addEventListener('click',()=>set(theme==='light'?'dark':'light'));
    })();
</script>
</body>
</html>
