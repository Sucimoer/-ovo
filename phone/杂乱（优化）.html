<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>杂乱资源 - 澪鸢</title>
    <link rel="icon" href="images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-image: url(../images/%E6%89%8B%E6%9C%BA%E4%B8%BB%E8%83%8C%E6%99%AF.jpeg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
        }
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
                background-size: cover;
                background-position: center center;
            }
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255,248,240,0.28);
            pointer-events: none;
            z-index: 0;
        }
        html.dark body::before {
            background: rgba(8,8,16,0.82);
            backdrop-filter: blur(1px);
        }
        nav, main {
            position: relative;
            z-index: 2;
        }
        .result-card {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(6px);
            border-radius: 1.25rem;
            transition: transform 0.15s;
        }
        .result-card:active { transform: scale(0.99); }
        .gradient-text {
            background: linear-gradient(to bottom, #FF72E1, #F54C7A);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
    </style>
</head>
<body>
<div class="relative min-h-screen flex flex-col">
    <nav class="fixed top-0 w-full bg-white/80 dark:bg-black/80 backdrop-blur-lg border-b z-50">
        <div class="flex items-center justify-between px-4 h-14 max-w-7xl mx-auto">
            <a href="index（优化）.html" class="font-bold">澪鸢ovo</a>
            <ul class="flex gap-4 text-sm">
                <li><a href="游戏（优化）.html">游戏</a></li>
                <li><a href="动漫（优化）.html">动漫</a></li>
                <li><a href="杂乱（优化）.html">杂乱</a></li>
            </ul>
            <button role="switch" class="theme-switch">🌙</button>
        </div>
    </nav>
    <main class="container mx-auto px-4 pt-20 pb-8">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-[2fr_1fr]">
            <div class="space-y-3">
                <div class="result-card p-4"><a href="小说（优化）.html" class="text-blue-600 font-medium block">小说与漫画</a></div>
                <div class="result-card p-4"><a href="../密码锁.html" class="text-blue-600 font-medium block">hhh</a></div>
                <div class="result-card p-4"><a href="软件（优化）.html" class="text-blue-600 font-medium block">软件</a></div>
                <div class="result-card p-4"><a href="一些神奇网页（优化）.html" class="text-blue-600 font-medium block">一些神奇网页</a></div>
            </div>
            <div class="hidden md:block"><div class="gradient-text text-4xl font-bold">澪鸢ovo</div></div>
        </div>
    </main>
</div>
<script>
    (function(){
        function getCurrentTheme() {
            return localStorage.getItem('theme') || 'light';
        }
        function setTheme(t){
            const root = document.documentElement;
            root.classList.remove('light','dark');
            root.classList.add(t);
            root.style.colorScheme = t;
            localStorage.setItem('theme', t);
            const btn = document.querySelector('[role="switch"]');
            if (btn) btn.innerHTML = t === 'dark' ? '☀️' : '🌙';
        }
        setTheme(getCurrentTheme());
        document.querySelector('[role="switch"]').addEventListener('click', () => {
            const current = getCurrentTheme();
            setTheme(current === 'light' ? 'dark' : 'light');
        });
    })();
</script>
</body>
</html>
