<script>
(function() {
    function getStoredTheme() { return localStorage.getItem('theme') || 'light'; }
    function applyTheme(theme) {
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
        localStorage.setItem('theme', theme);
        const btn = document.querySelector('.theme-switch');
        if (btn) {
            const isDark = theme === 'dark';
            btn.setAttribute('aria-checked', isDark);
            const span = btn.querySelector('span');
            if (span) {
                let svg = span.querySelector('svg');
                if (svg) svg.innerHTML = isDark ? '<path fill="currentColor" d="M12 2a9 9 0 1 0 9 9c0-.46-.04-.92-.12-1.36a7 7 0 1 1-8.52-8.52c-.44-.08-.9-.12-1.36-.12z"/>' : '<g fill="currentColor"><path d="M19 12a7 7 0 11-7-7 7 7 0 017 7z"/><path d="M12 22.96a.969.969 0 01-1-.96v-.08a1 1 0 012 0 1.038 1.038 0 01-1 1.04z"/></g>';
            }
        }
    }
    function toggleTheme() { applyTheme(getStoredTheme() === 'light' ? 'dark' : 'light'); }
    applyTheme(getStoredTheme());
    document.querySelector('.theme-switch')?.addEventListener('click', toggleTheme);
})();
</script>
