<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☁️ 云图库 - 私人图片存储</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4f6ef7;
            --primary-hover: #3b54e0;
            --text: #2c3e50;
            --text-light: #6b7d8e;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.18), 0 8px 20px rgba(0, 0, 0, 0.08);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== 顶部导航 ========== */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            cursor: default;
        }
        .navbar .logo .icon-cloud {
            font-size: 1.6rem;
        }
        .navbar .stats {
            display: flex;
            gap: 20px;
            font-size: 0.88rem;
            color: var(--text-light);
            align-items: center;
        }
        .navbar .stats span {
            background: #f7f8fa;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 500;
            white-space: nowrap;
        }
        .navbar .stats .count-num {
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
        }

        /* ========== 主容器 ========== */
        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        /* ========== 上传区域 ========== */
        .upload-zone-wrapper {
            margin-bottom: 30px;
        }
        .upload-zone {
            background: var(--card-bg);
            border: 2px dashed #d0d7e3;
            border-radius: var(--radius);
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .upload-zone:hover {
            border-color: var(--primary);
            background: #f8faff;
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }
        .upload-zone.drag-over {
            border-color: var(--primary);
            background: #eef2ff;
            box-shadow: 0 0 0 8px rgba(79, 110, 247, 0.08);
            transform: scale(1.008);
        }
        .upload-zone .upload-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
            display: block;
            transition: var(--transition);
        }
        .upload-zone.drag-over .upload-icon {
            transform: translateY(-8px) scale(1.1);
        }
        .upload-zone h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }
        .upload-zone p {
            font-size: 0.9rem;
            color: var(--text-light);
            margin: 0;
        }
        .upload-zone .btn-upload {
            display: inline-block;
            margin-top: 14px;
            background: var(--primary);
            color: #fff;
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            letter-spacing: 0.3px;
        }
        .upload-zone .btn-upload:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(79, 110, 247, 0.35);
            transform: translateY(-2px);
        }
        #fileInput {
            display: none;
        }

        /* ========== 工具栏 ========== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 22px;
        }
        .toolbar .search-box {
            flex: 1;
            min-width: 220px;
            max-width: 400px;
            position: relative;
        }
        .toolbar .search-box input {
            width: 100%;
            padding: 11px 16px 11px 40px;
            border-radius: 25px;
            border: 1.5px solid var(--border);
            font-size: 0.95rem;
            background: var(--card-bg);
            transition: var(--transition);
            outline: none;
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }
        .toolbar .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.08);
        }
        .toolbar .search-box .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: #a0aec0;
            pointer-events: none;
        }
        .toolbar .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toolbar .btn {
            padding: 9px 18px;
            border-radius: 22px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }
        .toolbar .btn:hover {
            background: #f7f8fa;
            border-color: #c0c8d4;
        }
        .toolbar .btn.btn-danger {
            color: var(--danger);
            border-color: #fdd;
            background: #fff5f5;
        }
        .toolbar .btn.btn-danger:hover {
            background: #ffe8e8;
            border-color: var(--danger);
        }
        .toolbar .btn.btn-primary-outline {
            color: var(--primary);
            border-color: #d4dafc;
            background: #f8faff;
        }
        .toolbar .btn.btn-primary-outline:hover {
            background: #eef2ff;
            border-color: var(--primary);
        }

        /* ========== 图片网格 ========== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }
        .gallery-grid.empty-state {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            grid-template-columns: 1fr;
        }
        .empty-message {
            text-align: center;
            color: #b0bcc8;
            font-size: 1.1rem;
        }
        .empty-message .empty-icon {
            font-size: 5rem;
            display: block;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* ========== 图片卡片 ========== */
        .image-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            border: 1px solid var(--border);
            animation: fadeInUp 0.4s ease forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .image-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
            border-color: #cdd5e0;
        }
        .image-card .img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #f1f3f6;
            position: relative;
        }
        .image-card .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
            display: block;
        }
        .image-card:hover .img-wrapper img {
            transform: scale(1.06);
        }
        .image-card .card-info {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .image-card .card-info .img-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .image-card .card-info .img-date {
            font-size: 0.73rem;
            color: var(--text-light);
            white-space: nowrap;
        }
        .image-card .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            backdrop-filter: blur(4px);
        }
        .image-card:hover .btn-delete {
            opacity: 1;
        }
        .image-card .btn-delete:hover {
            background: var(--danger);
            transform: scale(1.1);
        }

        /* ========== 灯箱 ========== */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .lightbox-overlay .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            object-fit: contain;
            cursor: default;
        }
        .lightbox-overlay .lightbox-close {
            position: absolute;
            top: 20px;
            right: 28px;
            font-size: 2.4rem;
            color: #fff;
            cursor: pointer;
            z-index: 10;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: var(--transition);
            border: none;
        }
        .lightbox-overlay .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.08);
        }
        .lightbox-overlay .lightbox-info {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            pointer-events: none;
        }

        /* ========== Toast 提示 ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1a1d23;
            color: #fff;
            padding: 12px 26px;
            border-radius: 25px;
            font-weight: 500;
            z-index: 1100;
            font-size: 0.9rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: var(--success);
        }
        .toast.error {
            background: var(--danger);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 10px;
            }
            .upload-zone {
                padding: 24px 16px;
            }
            .upload-zone .upload-icon {
                font-size: 2.5rem;
            }
            .navbar {
                padding: 0 12px;
                height: 50px;
            }
            .navbar .logo {
                font-size: 1rem;
            }
            .navbar .stats {
                gap: 8px;
                font-size: 0.75rem;
            }
            .navbar .stats span {
                padding: 4px 10px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .search-box {
                max-width: 100%;
            }
            .image-card .btn-delete {
                opacity: 1;
                width: 26px;
                height: 26px;
                top: 6px;
                right: 6px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== 顶部导航 ==================== -->
    <nav class="navbar">
        <div class="logo">
            <span class="icon-cloud">☁️</span> 云图库
        </div>
        <div class="stats">
            <span>📸 图片数量：<strong class="count-num" id="imgCount">0</strong></span>
            <span>💾 已用空间：<strong id="storageUsed">0 KB</strong></span>
        </div>
    </nav>

    <!-- ==================== 主容器 ==================== -->
    <div class="main-container">
        <!-- 上传区域 -->
        <div class="upload-zone-wrapper">
            <div class="upload-zone" id="uploadZone">
                <span class="upload-icon">📤</span>
                <h3>拖拽图片到此处上传</h3>
                <p>支持 JPG / PNG / WebP / GIF · 自动压缩存储</p>
                <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
                    📁 选择图片上传
                </button>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索图片名称...">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary-outline" id="btnRefresh" title="刷新图库">🔄 刷新</button>
                <button class="btn" id="btnSortNewest" title="按时间排序">🕐 最新</button>
                <button class="btn" id="btnSortOldest" title="按时间排序">🕐 最早</button>
                <button class="btn btn-danger" id="btnClearAll" title="清空所有图片">🗑️ 清空图库</button>
            </div>
        </div>

        <!-- 图片网格 -->
        <div class="gallery-grid" id="galleryGrid">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- ==================== 灯箱（查看大图） ==================== -->
    <div class="lightbox-overlay" id="lightbox" style="display:none;">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <img class="lightbox-img" id="lightboxImg" src="" alt="预览">
        <div class="lightbox-info" id="lightboxInfo"></div>
    </div>

    <!-- ==================== Toast 提示 ==================== -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
                      const STORAGE_KEY = 'cloud_gallery_images_v2';
            const MAX_STORAGE_MB = 4.5; 
            const MAX_STORAGE_BYTES = MAX_STORAGE_MB * 1024 * 1024;

                      const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            const galleryGrid = document.getElementById('galleryGrid');
            const searchInput = document.getElementById('searchInput');
            const btnRefresh = document.getElementById('btnRefresh');
            const btnSortNewest = document.getElementById('btnSortNewest');
            const btnSortOldest = document.getElementById('btnSortOldest');
            const btnClearAll = document.getElementById('btnClearAll');
            const imgCountEl = document.getElementById('imgCount');
            const storageUsedEl = document.getElementById('storageUsed');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxInfo = document.getElementById('lightboxInfo');
            const lightboxClose = document.getElementById('lightboxClose');
            const toast = document.getElementById('toast');

              let images = [];
            let currentSort = 'newest'; // 'newest' | 'oldest'
            let searchQuery = '';

                        function loadImages() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        images = JSON.parse(raw);
                     
                        if (!Array.isArray(images)) images = [];
                        images = images.filter(img => img && img.id && img.data && img.name);
                    } else {
                        images = [];
                    }
                } catch (e) {
                    console.error('加载图片数据失败:', e);
                    images = [];
                }
            }

         function saveImages() {
                try {
                    const json = JSON.stringify(images);
                    const bytes = new Blob([json]).size;
                    if (bytes > MAX_STORAGE_BYTES) {
                        showToast('⚠️ 存储空间接近上限，请删除部分图片', 'error');
                    }
                    localStorage.setItem(STORAGE_KEY, json);
                    updateStats();
                } catch (e) {
                    if (e.name === 'QuotaExceededError') {
                        showToast('❌ 存储空间已满！请删除一些图片后重试', 'error');
                    } else {
                        console.error('保存失败:', e);
                        showToast('保存失败，请重试', 'error');
                    }
                }
            }

  
            function updateStats() {
                imgCountEl.textContent = images.length;
                const json = JSON.stringify(images);
                const bytes = new Blob([json]).size;
                if (bytes < 1024) {
                    storageUsedEl.textContent = bytes + ' B';
                } else if (bytes < 1024 * 1024) {
                    storageUsedEl.textContent = (bytes / 1024).toFixed(2) + ' KB';
                } else {
                    storageUsedEl.textContent = (bytes / (1024 * 1024)).toFixed(2) + ' MB';
                }
            }


            function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.75) {
                return new Promise((resolve, reject) => {

                    if (file.size < 200 * 1024) {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            let w = img.width;
                            let h = img.height;
            
                            if (w > maxWidth || h > maxHeight) {
                                const ratio = Math.min(maxWidth / w, maxHeight / h);
                                w = Math.round(w * ratio);
                                h = Math.round(h * ratio);
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = w;
                            canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            const dataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve(dataUrl);
                        };
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

                  async function addImages(files) {
                if (!files || files.length === 0) return;
                let addedCount = 0;
                let skippedCount = 0;

                for (const file of files) {
             
                    if (!file.type.startsWith('image/')) {
                        skippedCount++;
                        continue;
                    }
                    try {
                        const dataUrl = await compressImage(file);
                        const imgObj = {
                            id: generateId(),
                            name: file.name,
                            data: dataUrl,
                            size: file.size,
                            type: file.type,
                            timestamp: Date.now(),
                        };
                        images.unshift(imgObj);
                        addedCount++;
                    } catch (err) {
                        console.error('处理图片失败:', file.name, err);
                        skippedCount++;
                    }
                }

                if (addedCount > 0) {
                    saveImages();
                    renderGallery();
                    showToast(`✅ 成功上传 ${addedCount} 张图片` + (skippedCount > 0 ? `，${skippedCount} 张跳过` : ''),
                        'success');
                } else if (skippedCount > 0) {
                    showToast('⚠️ 没有有效的图片文件被上传', 'error');
                }
            }

                     function generateId() {
                return 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

              function deleteImage(id, e) {
                e.stopPropagation();
                if (confirm('确定要删除这张图片吗？此操作不可恢复。')) {
                    images = images.filter(img => img.id !== id);
                    saveImages();
                    renderGallery();
                    showToast('🗑️ 图片已删除', 'success');
                }
            }

                       function clearAllImages() {
                if (images.length === 0) {
                    showToast('图库已经是空的', 'error');
                    return;
                }
                if (confirm(`确定要清空整个图库吗？将删除全部 ${images.length} 张图片，此操作不可恢复！`)) {
                    images = [];
                    saveImages();
                    renderGallery();
                    showToast('🗑️ 图库已清空', 'success');
                }
            }

              function openLightbox(imgObj) {
                lightboxImg.src = imgObj.data;
                lightboxInfo.textContent = `${imgObj.name} · ${formatSize(imgObj.size)} · ${formatDate(imgObj.timestamp)}`;
                lightbox.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.style.display = 'none';
                lightboxImg.src = '';
                document.body.style.overflow = '';
            }
            function formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            }

            function formatDate(timestamp) {
                const d = new Date(timestamp);
                const now = new Date();
                const diffMs = now - d;
                const diffMin = Math.floor(diffMs / 60000);
                const diffHour = Math.floor(diffMs / 3600000);
                const diffDay = Math.floor(diffMs / 86400000);

                if (diffMin < 1) return '刚刚';
                if (diffMin < 60) return diffMin + ' 分钟前';
                if (diffHour < 24) return diffHour + ' 小时前';
                if (diffDay < 7) return diffDay + ' 天前';

                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

              function getSortedImages() {
                let filtered = [...images];

                if (searchQuery.trim()) {
                    const q = searchQuery.trim().toLowerCase();
                    filtered = filtered.filter(img => img.name.toLowerCase().includes(q));
                }
   
                if (currentSort === 'newest') {
                    filtered.sort((a, b) => b.timestamp - a.timestamp);
                } else {
                    filtered.sort((a, b) => a.timestamp - b.timestamp);
                }
                return filtered;
            }

                  function renderGallery() {
                const displayImages = getSortedImages();

                if (displayImages.length === 0) {
                    galleryGrid.classList.add('empty-state');
                    galleryGrid.innerHTML = `
                        <div class="empty-message">
                            <span class="empty-icon">🖼️</span>
                            <p>${images.length === 0 ? '图库空空如也，上传你的第一张图片吧！' : '没有匹配的图片'}</p>
                        </div>`;
                } else {
                    galleryGrid.classList.remove('empty-state');
                    galleryGrid.innerHTML = displayImages.map((img, index) => `
                        <div class="image-card" onclick="window._openLightboxById('${img.id}')" style="animation-delay: ${index * 0.04}s;">
                            <div class="img-wrapper">
                                <img src="${img.data}" alt="${escapeHtml(img.name)}" loading="lazy">
                            </div>
                            <div class="card-info">
                                <span class="img-name" title="${escapeHtml(img.name)}">${escapeHtml(img.name)}</span>
                                <span class="img-date">${formatDate(img.timestamp)}</span>
                            </div>
                            <button class="btn-delete" onclick="window._deleteImageById('${img.id}', event)" title="删除图片">🗑️</button>
                        </div>
                    `).join('');
                }
                updateStats();
            }
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            let toastTimer;

            function showToast(msg, type = '') {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.className = 'toast ' + type + ' show';
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }
            window._openLightboxById = function(id) {
                const img = images.find(i => i.id === id);
                if (img) openLightbox(img);
            };
            window._deleteImageById = function(id, event) {
                deleteImage(id, event);
            };


      
            fileInput.addEventListener('change', function() {
                if (this.files.length > 0) {
                    addImages(this.files);
                    this.value = ''; 
                }
            });


            uploadZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.add('drag-over');
            });
            uploadZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.remove('drag-over');
            });
            uploadZone.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    addImages(files);
                }
            });

            uploadZone.addEventListener('click', function(e) {
                if (e.target === this || e.target.closest('.upload-icon') || e.target.closest('h3') || e.target
                    .closest('p')) {
                    fileInput.click();
                }
            });


            searchInput.addEventListener('input', function() {
                searchQuery = this.value;
                renderGallery();
            });


            btnRefresh.addEventListener('click', function() {
                loadImages();
                renderGallery();
                showToast('🔄 图库已刷新', 'success');
            });


            btnSortNewest.addEventListener('click', function() {
                currentSort = 'newest';
                renderGallery();
                showToast('🕐 按最新上传排序', 'success');
            });

     
            btnSortOldest.addEventListener('click', function() {
                curren
         tSort = 'oldest';
                renderGallery();
                showToast('🕐 按最早上传排序', 'success');
            });

      
            btnClearAll.addEventListener('click', clearAllImages);

     lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', function(e) {
                if (e.target === this) closeLightbox();
            });

      
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightbox.style.display === 'flex') {
                    closeLightbox();
                }
         
                if (e.ctrlKey && e.key === 'o') {
                    e.preventDefault();
                    fileInput.click();
                }
            });

   
            document.addEventListener('paste', function(e) {
                const items = e.clipboardData?.items;
                if (!items) return;
                const imageFiles = [];
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        const file = item.getAsFile();
                        if (file) imageFiles.push(file);
                    }
                }
                if (imageFiles.length > 0) {
                    e.preventDefault();
                    addImages(imageFiles);
                }
            });

               function init() {
                loadImages();
                renderGallery();
                updateStats();
                console.log('☁️ 云图库已就绪！');
                console.log('💡 提示：支持拖拽上传、点击上传、Ctrl+V 粘贴图片');
                console.log('💡 按 Ctrl+O 快速打开文件选择窗口');
                console.log('💡 按 Esc 关闭灯箱预览');
                console.log('📦 当前图片数量:', images.length);
            }

            init();
        })();
    </script>
